# Premisave messenger-service, PRODUCTION, on one server with Docker.
#
#   cp deploy/env/production.env.example deploy/env/production.env     (then fill it in)
#   IMAGE_TAG=v1.0.0 docker compose --env-file deploy/env/production.env -f deploy/docker-compose.production.yml pull
#   IMAGE_TAG=v1.0.0 docker compose --env-file deploy/env/production.env -f deploy/docker-compose.production.yml up -d
#
# Differences from staging:
#   - MongoDB is NOT started here. Use a managed database (MongoDB Atlas, with backups) and put its
#     address in MONGODB_URI in deploy/env/production.env.
#   - The image is pulled by an exact version (IMAGE_TAG is required), so a release is the same image that
#     was tested on staging. Build locally instead with:  docker compose ... up -d --build
#   - JWT_SECRET and the actuator password have no fallback: the file refuses to start without them.
#   - Redis keeps its data on disk and is reachable only from the service, never from outside.
#
# Several copies can run side by side: live messages are relayed through Redis. Each copy keeps attachments in its own
# volume, though, so with more than one copy use a shared network storage (STORAGE_MODE=NETWORK, see deploy/README.md).

name: premisave-messenger-production

services:
  messenger:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/peacemakerbill/premisave-messenger-service:${IMAGE_TAG:?Set IMAGE_TAG to the version to run, for example v1.0.0}
    container_name: premisave-messenger
    env_file:
      - env/production.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_URL: redis://redis:6379
      CALLS_RECORDINGS_DIR: /data/recordings
      # LOCAL keeps videos in the folder mounted below. NETWORK expects that folder to be a mounted network share (set
      # CALLS_RECORDINGS_HOST_DIR to the share's folder on this server) and refuses to record if it is not.
      CALLS_RECORDINGS_MODE: ${CALLS_RECORDINGS_MODE:-LOCAL}
      CALLS_RECORDINGS_NETWORK_MOUNT_PATH: /data/recordings
      CALLS_RECORDINGS_NETWORK_DIRECTORY: ""
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/env/production.env. It must equal the auth-service value}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?Set ACTUATOR_PASSWORD in deploy/env/production.env}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8081}:8081"
    volumes:
      - messenger-data:/data/messenger-storage
      - ${CALLS_RECORDINGS_HOST_DIR:-./livekit/recordings}:/data/recordings
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  redis:
    image: redis:7-alpine
    container_name: premisave-messenger-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: always

volumes:
  messenger-data:
  redis-data:
