# Premisave messenger-service on FLY.IO, PRODUCTION.
#
#   fly apps create premisave-messenger
#   fly volumes create premisave_messenger --region jnb --size 5 -a premisave-messenger
#   fly secrets import -a premisave-messenger < deploy/env/production.env
#   fly deploy . --config deploy/fly.production.toml --dockerfile Dockerfile
#
# One machine is the simplest. Several work too (live messages are relayed through Redis), but the volume belongs to one
# machine, so for more than one use a shared network storage (STORAGE_MODE=NETWORK).
# Fly's Redis (Upstash) gives an address with the password in it: use it for REDIS_URL.
# MongoDB is not offered by Fly: use MongoDB Atlas for MONGODB_URI.

app = "premisave-messenger"
primary_region = "jnb"

[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8081"

[mounts]
  source = "premisave_messenger"
  destination = "/data"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/actuator/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
