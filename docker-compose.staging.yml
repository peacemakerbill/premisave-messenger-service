# Premisave messenger-service, STAGING, on one server with Docker.
#
#   cp deploy/env/staging.env.example deploy/env/staging.env     (then fill it in)
#   docker compose --env-file deploy/env/staging.env -f docker-compose.staging.yml up -d --build
#
# Staging is a copy of production for testing a release: same image, same profile settings, its own data.
# It includes its own MongoDB and Redis. Use a separate database from production, always.
#
# The messenger signs people in through the auth-service of the SAME environment (AUTH_SERVICE_URL), and both
# must share JWT_SECRET. INTERNAL_API_KEY here must equal API_KEY there.
#
# To use a published image instead of building here, log in once (docker login ghcr.io) and run:
#   IMAGE_TAG=staging docker compose --env-file deploy/env/staging.env -f docker-compose.staging.yml pull
#   IMAGE_TAG=staging docker compose --env-file deploy/env/staging.env -f docker-compose.staging.yml up -d
#
# Run ONE copy of the service: live messages go through a broker inside the service, so a second copy would not
# see the first one's connections.

name: premisave-messenger-staging

services:
  messenger:
    build: .
    image: ghcr.io/peacemakerbill/premisave-messenger-service:${IMAGE_TAG:-staging}
    container_name: premisave-messenger-staging
    env_file:
      - deploy/env/staging.env
    environment:
      SPRING_PROFILES_ACTIVE: staging
      MONGODB_URI: mongodb://mongo:27017/premisave-messenger-staging
      REDIS_URL: redis://redis:6379
    # Published on this server only. Put a reverse proxy (nginx, Caddy, Traefik) in front for https and websockets.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8081}:8081"
    volumes:
      - messenger-data:/data/messenger-storage
      - ${CALLS_RECORDINGS_HOST_DIR:-./deploy/livekit/recordings}:/data/recordings
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:7
    container_name: premisave-messenger-staging-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: premisave-messenger-staging-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  messenger-data:
  mongo-data:
  redis-data:
