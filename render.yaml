# Premisave messenger-service on RENDER: three environments in one Blueprint.
#
#   development   free plan (no disk, sleeps when idle), deploys every push to the "develop" branch
#   staging       paid starter plan with a small disk, deploys every push to the "staging" branch, private network
#   production    paid standard plan with a disk for attachments, deploys by hand, private network
#
# Plans and sizes are choices, change them freely. A disk needs a paid plan, and a service with a disk
# runs as one instance. Run ONE instance of the messenger in any case: live messages go through a broker inside
# the service, so a second instance would not see the first one's connections.
#
# How to use it: Render dashboard > New > Blueprint > pick this repository. Render asks once for every
# value marked "sync: false" (secrets and addresses). Names must be unique in the whole file.
# MongoDB is not offered by Render: create a free cluster on MongoDB Atlas and use its address for MONGODB_URI.
#
# Sign in goes through the auth-service of the SAME environment:
#   AUTH_SERVICE_URL     its public address, for example https://premisave-auth-staging.onrender.com
#   JWT_SECRET           the same value as the auth-service
#   INTERNAL_API_KEY     the same value as the auth-service API_KEY
# STORAGE_PUBLIC_BASE_URL is this service's own public address (download links inside messages start with it).
#
# Calls: Render cannot run a LiveKit server (it needs UDP). Use LiveKit Cloud or a LiveKit server on your own host and
# fill the LIVEKIT_* values, or leave LIVEKIT_API_KEY and LIVEKIT_API_SECRET empty to keep calls off.
# Call recording needs a folder shared with the LiveKit egress, so it works only on one server (docker-compose files).
# Render Key Value (Redis) is reached over the private network, so it needs no password.

projects:
  - name: premisave-messenger
    environments:
      - name: development
        services:
          - type: web
            name: premisave-messenger-dev
            runtime: docker
            plan: free
            region: frankfurt
            branch: develop
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /actuator/health
            autoDeployTrigger: commit
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: dev
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: premisave-messenger-redis-dev
                  property: connectionString
              - key: ACTUATOR_PASSWORD
                generateValue: true
              - key: MONGODB_URI
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: AUTH_SERVICE_URL
                sync: false
              - key: INTERNAL_API_KEY
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              - key: LIVEKIT_URL
                sync: false
              - key: LIVEKIT_API_URL
                sync: false
              - key: LIVEKIT_API_KEY
                sync: false
              - key: LIVEKIT_API_SECRET
                sync: false
          - type: keyvalue
            name: premisave-messenger-redis-dev
            plan: free
            region: frankfurt
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

      - name: staging
        networking:
          isolation: enabled
        services:
          - type: web
            name: premisave-messenger-staging
            runtime: docker
            plan: starter
            region: frankfurt
            branch: staging
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /actuator/health
            autoDeployTrigger: commit
            disk:
              name: messenger-data-staging
              mountPath: /data
              sizeGB: 2
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: staging
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: premisave-messenger-redis-staging
                  property: connectionString
              - key: ACTUATOR_PASSWORD
                generateValue: true
              - key: MONGODB_URI
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: AUTH_SERVICE_URL
                sync: false
              - key: INTERNAL_API_KEY
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              - key: LIVEKIT_URL
                sync: false
              - key: LIVEKIT_API_URL
                sync: false
              - key: LIVEKIT_API_KEY
                sync: false
              - key: LIVEKIT_API_SECRET
                sync: false
          - type: keyvalue
            name: premisave-messenger-redis-staging
            plan: free
            region: frankfurt
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        services:
          - type: web
            name: premisave-messenger
            runtime: docker
            plan: standard
            region: frankfurt
            branch: main
            dockerfilePath: ./Dockerfile
            dockerContext: .
            healthCheckPath: /actuator/health
            autoDeployTrigger: "off"
            disk:
              name: messenger-data
              mountPath: /data
              sizeGB: 10
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: prod
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: premisave-messenger-redis
                  property: connectionString
              - key: ACTUATOR_PASSWORD
                generateValue: true
              - key: MONGODB_URI
                sync: false
              - key: JWT_SECRET
                sync: false
              - key: AUTH_SERVICE_URL
                sync: false
              - key: INTERNAL_API_KEY
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              - key: LIVEKIT_URL
                sync: false
              - key: LIVEKIT_API_URL
                sync: false
              - key: LIVEKIT_API_KEY
                sync: false
              - key: LIVEKIT_API_SECRET
                sync: false
          - type: keyvalue
            name: premisave-messenger-redis
            plan: starter
            region: frankfurt
            maxmemoryPolicy: volatile-lru
            ipAllowList: []
