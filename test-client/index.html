<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premisave Messenger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
:root {
  --accent: #3390ec;
  --accent-strong: #2481cc;
  --accent-ink: #ffffff;
  --btn-bg: #3390ec;
  --btn-hover: #2a7fd4;
  --app-bg: #f4f4f5;
  --panel: #ffffff;
  --panel-2: #f4f4f5;
  --row-hover: #f4f4f5;
  --row-active: #3390ec;
  --chat-bg: linear-gradient(165deg, #d3e6b7 0%, #b7daa5 38%, #92c8a5 100%);
  --bubble-in: #ffffff;
  --bubble-out: #eeffde;
  --text: #000000;
  --text-2: #707579;
  --line: #e4e4e4;
  --field-line: #d5d9de;
  --tick: #4fae4e;
  --meta-in: #9aa5ae;
  --meta-out: #53a650;
  --out-accent: #3d9a3d;
  --out-link: #2481cc;
  --danger: #e53935;
  --warn-bg: #fff3c4;
  --warn-ink: #6b5200;
  --input-bg: #ffffff;
  --shadow: 0 1px 2px rgba(16,35,47,.15);
  --pop-shadow: 0 6px 26px rgba(16,35,47,.22);
  --glass: rgba(28,56,40,.36);
  --reply-in: rgba(51,144,236,.1);
  --reply-out: rgba(79,174,78,.15);
  --drawer-head: linear-gradient(135deg, #4aa3f4, #2b7fd1);
  --pc0: #d1364f; --pc1: #c26a14; --pc2: #5a52e0; --pc3: #2f9e44; --pc4: #12907f; --pc5: #1b7fc4; --pc6: #a93cc5;
}
[data-theme="dark"] {
  --accent: #6ab3f3;
  --accent-strong: #6ab3f3;
  --btn-bg: #4a86c0;
  --btn-hover: #3d77b0;
  --app-bg: #0e1621;
  --panel: #17212b;
  --panel-2: #242f3d;
  --row-hover: #202b36;
  --row-active: #2b5278;
  --chat-bg: linear-gradient(165deg, #101b27 0%, #0e1621 100%);
  --bubble-in: #182533;
  --bubble-out: #2b5278;
  --text: #f5f5f5;
  --text-2: #7f91a4;
  --line: #0e1621;
  --field-line: #31404f;
  --tick: #7cc0f7;
  --meta-in: #6d7f8f;
  --meta-out: #7da8d3;
  --out-accent: #8cc4f7;
  --out-link: #8cc4f7;
  --warn-bg: #3a3112;
  --warn-ink: #f1d77a;
  --input-bg: #242f3d;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --pop-shadow: 0 6px 26px rgba(0,0,0,.55);
  --glass: rgba(10,18,27,.62);
  --reply-in: rgba(106,179,243,.12);
  --reply-out: rgba(255,255,255,.1);
  --drawer-head: #232e3c;
  --pc0: #ff7a8f; --pc1: #ffb074; --pc2: #9d97ff; --pc3: #7ddc8f; --pc4: #5ae3d0; --pc5: #6fc4fb; --pc6: #e5a0f5;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 15px/1.4 Roboto, -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  background: var(--app-bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { display: inline-flex; width: 24px; height: 24px; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico svg .f { fill: currentColor; stroke: none; }
.hidden { display: none !important; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-2) 40%, transparent) transparent; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: clamp(320px, 28vw, 420px) 1fr; height: 100vh; height: 100dvh; max-width: 1680px; margin: 0 auto; background: var(--panel); position: relative; }
@media (min-width: 1700px) { body { padding: 18px 0; } .app { height: calc(100vh - 36px); box-shadow: var(--pop-shadow); border-radius: 12px; overflow: hidden; } }

/* ---------- list panel ---------- */
.list { position: relative; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--panel); }
.list-head { display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px 8px; min-height: 58px; }
.list-head h1 { flex: 1; margin: 0; padding-left: 6px; font-size: 20px; font-weight: 500; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); transition: background .15s; flex: none; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn .ico { width: 24px; height: 24px; }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; height: 42px; border: 2px solid transparent; border-radius: 21px; background: var(--panel-2); padding: 0 14px 0 46px; outline: 0; transition: border-color .15s, background .15s; }
.search input:focus { border-color: var(--accent); background: var(--panel); }
.search input::placeholder { color: var(--text-2); }
.search .ico { position: absolute; left: 15px; top: 11px; width: 20px; height: 20px; color: var(--text-2); pointer-events: none; }
.folders { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.ftab { position: relative; display: flex; align-items: center; gap: 7px; padding: 10px 14px 11px; font-weight: 500; color: var(--text-2); border-radius: 8px 8px 0 0; transition: color .15s, background .15s; }
.ftab::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); transform: scaleX(0); transition: transform .18s ease; }
.ftab:hover { background: var(--row-hover); color: var(--text); }
.ftab.active { color: var(--accent-strong); }
.ftab.active::after { transform: scaleX(1); }
.ftab .badge { position: static; height: 19px; min-width: 19px; font-size: 11.5px; background: var(--text-2); }
.ftab.active .badge { background: var(--btn-bg); }
.fab { position: absolute; right: 18px; bottom: 18px; z-index: 5; width: 56px; height: 56px; border-radius: 50%; background: var(--btn-bg); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); transition: transform .15s, background .15s; }
.fab:hover { background: var(--btn-hover); }
.fab:active { transform: scale(.94); }
.fab .ico { width: 26px; height: 26px; }
.conn { margin: 8px 12px 0; padding: 7px 12px; border-radius: 10px; font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); display: flex; align-items: center; gap: 8px; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.rows { flex: 1; min-height: 0; padding: 6px 6px 88px; }
.row { display: flex; gap: 12px; align-items: center; padding: 0 12px 0 10px; width: 100%; text-align: left; height: 72px; position: relative; border-radius: 12px; }
.row:hover { background: var(--row-hover); }
.row.active, .row.active:hover { background: var(--row-active); color: #fff; }
.row .body { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.row .top, .row .bottom { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .name { flex: 1; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { font-size: 12.5px; color: var(--text-2); flex: none; }
.row.unread .time { color: var(--accent-strong); }
.row .preview { flex: 1; min-width: 0; color: var(--text-2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.row .preview .ico { width: 16px; height: 16px; }
.row .preview .txt { overflow: hidden; text-overflow: ellipsis; }
.row .preview .who { color: var(--text); }
.row.active .time, .row.active .preview, .row.active .preview .who, .row.active .preview .tick, .row.active .at { color: rgba(255,255,255,.88); }
.row.active .preview .txt { color: #fff !important; }
.row.active .badge { background: #fff; color: var(--row-active); }
.row.active .av .dot { border-color: var(--row-active); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--btn-bg); color: #fff; font-size: 12.5px; font-weight: 500; display: grid; place-items: center; flex: none; }
.empty { padding: 44px 28px; text-align: center; color: var(--text-2); }
.empty h3 { margin: 12px 0 6px; font-size: 16px; color: var(--text); font-weight: 500; }
.empty p { margin: 0 0 16px; }

/* ---------- side menu ---------- */
.dr-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .2s ease; }
.dr-scrim.open { opacity: 1; }
.drawer { position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); background: var(--panel); box-shadow: var(--pop-shadow); display: flex; flex-direction: column; transform: translateX(-102%); transition: transform .24s cubic-bezier(.2,.8,.2,1); }
.drawer.open { transform: none; }
.dr-head { position: relative; background: var(--drawer-head); color: #fff; padding: 20px 18px 16px; }
.dr-head .dr-theme { position: absolute; right: 10px; top: 10px; color: #fff; }
.dr-head .dr-theme:hover { background: rgba(255,255,255,.16); }
.dr-me { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; max-width: 100%; }
.dr-me .av.lg { width: 64px; height: 64px; font-size: 24px; margin-bottom: 10px; }
.dr-me .nm { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.dr-me .em { font-size: 13.5px; opacity: .8; overflow-wrap: anywhere; }
.dr-items { flex: 1; overflow-y: auto; padding: 8px 0; }
.dr-items hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.dr-item { display: flex; align-items: center; gap: 22px; width: 100%; height: 48px; padding: 0 22px; text-align: left; font-weight: 500; }
.dr-item:hover { background: var(--row-hover); }
.dr-item .ico { color: var(--text-2); }
.dr-foot { padding: 12px 22px; font-size: 12.5px; color: var(--text-2); }
.switch { margin-left: auto; position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--field-line); transition: background .18s; flex: none; }
.switch i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .18s; }
.switch.on { background: var(--btn-bg); }
.switch.on i { transform: translateX(16px); }

/* ---------- avatar ---------- */
.av { --g1: #72d5fd; --g2: #2a9ef1; width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 500; font-size: 20px; position: relative; background-image: linear-gradient(180deg, var(--g1), var(--g2)); background-size: cover; background-position: center; user-select: none; }
.av.p0 { --g1: #ff885e; --g2: #ff516a; } .av.p1 { --g1: #ffcd6a; --g2: #ffa85c; } .av.p2 { --g1: #82b1ff; --g2: #665fff; }
.av.p3 { --g1: #a0de7e; --g2: #54cb68; } .av.p4 { --g1: #53edd6; --g2: #28c9b7; } .av.p5 { --g1: #72d5fd; --g2: #2a9ef1; } .av.p6 { --g1: #e0a2f3; --g2: #d669ed; }
.av.sm { width: 42px; height: 42px; font-size: 16px; }
.av.xs { width: 28px; height: 28px; font-size: 11px; }
.av.lg { width: 100px; height: 100px; font-size: 38px; }
.av .dot { position: absolute; right: 0; bottom: 1px; width: 14px; height: 14px; border-radius: 50%; background: #0ac630; border: 2.5px solid var(--panel); }
.av.grp::after { content: none; }

/* ---------- chat panel ---------- */
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat-bg); position: relative; }
.chat-head { height: 58px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 14px; background: var(--panel); box-shadow: 0 1px 0 var(--line), 0 1px 4px rgba(16,35,47,.06); z-index: 3; }
.chat-head .who { flex: 1; min-width: 0; text-align: left; }
.chat-head .who .n { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head .who .s { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 19px; }
.chat-head .who .s.live { color: var(--accent-strong); }
.back { display: none; }
.search-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
.search-bar input { flex: 1; height: 38px; border: 0; border-radius: 19px; background: var(--panel-2); padding: 0 16px; outline-offset: 0; }
.search-bar .count { font-size: 12.5px; color: var(--text-2); min-width: 54px; text-align: right; }

.wall { position: absolute; inset: 0; background-image: var(--wall); background-size: 220px 220px; pointer-events: none; z-index: 0; }
.thread { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 12px max(12px, calc((100% - 760px) / 2)) 8px; display: flex; flex-direction: column; }
.thread .spacer { flex: 1; }
.day, .older { align-self: center; margin: 10px 0 6px; padding: 4px 12px; border-radius: 14px; background: var(--glass); color: #fff; font-size: 13px; font-weight: 500; backdrop-filter: blur(6px); }
.older { padding: 6px 14px; }
.sys { align-self: center; margin: 6px 0; padding: 6px 12px; border-radius: 12px; background: var(--glass); color: #fff; font-size: 13px; text-align: center; max-width: 80%; backdrop-filter: blur(6px); }

.msg { --c: var(--bubble-in); display: flex; margin-top: 2px; position: relative; }
.msg.out { --c: var(--bubble-out); justify-content: flex-end; }
.msg.first { margin-top: 8px; }
.msg.hit .bubble { outline: 2px solid var(--accent); }
.msg.dim .bubble { opacity: .35; }
.bubble { position: relative; max-width: min(540px, 78%); background: var(--c); border-radius: 12px; padding: 6px 10px 6px 10px; box-shadow: var(--shadow); min-width: 64px; word-wrap: break-word; overflow-wrap: anywhere; }
/* messages stacked from one person hug each other, the last one gets the tail */
.msg.in:not(.first) .bubble { border-top-left-radius: 5px; }
.msg.out:not(.first) .bubble { border-top-right-radius: 5px; }
.msg.in:has(+ .msg:not(.first)) .bubble { border-bottom-left-radius: 5px; }
.msg.out:has(+ .msg:not(.first)) .bubble { border-bottom-right-radius: 5px; }
.msg.in:not(:has(+ .msg:not(.first))) .bubble { border-bottom-left-radius: 0; }
.msg.out:not(:has(+ .msg:not(.first))) .bubble { border-bottom-right-radius: 0; }
.msg.in:not(:has(+ .msg:not(.first))) .bubble::before,
.msg.out:not(:has(+ .msg:not(.first))) .bubble::before { content: ""; position: absolute; bottom: 0; width: 10px; height: 10px; pointer-events: none; }
.msg.in:not(:has(+ .msg:not(.first))) .bubble::before { left: -10px; background: radial-gradient(circle at 0 0, transparent 9.5px, var(--c) 10px); }
.msg.out:not(:has(+ .msg:not(.first))) .bubble::before { right: -10px; background: radial-gradient(circle at 100% 0, transparent 9.5px, var(--c) 10px); }
.bubble .sender { font-size: 14px; font-weight: 500; margin-bottom: 1px; }
.bubble .text { white-space: pre-wrap; font-size: 15.5px; line-height: 1.36; }
.bubble .text a { color: var(--accent-strong); text-decoration: none; }
.bubble .text a:hover { text-decoration: underline; }
.bubble .text mark { background: #ffd54f; color: #111; border-radius: 2px; }
.bubble .text.gone { color: var(--text-2); font-style: italic; display: flex; align-items: center; gap: 6px; }
.bubble .text.gone .ico { width: 16px; height: 16px; }
.meta { float: right; margin: 6px 0 -4px 10px; display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--meta-in); line-height: 1; height: 16px; position: relative; top: 2px; }
.msg.out .meta { color: var(--meta-out); }
.meta .tick { width: 18px; height: 18px; opacity: .65; }
.meta .tick.read { color: var(--tick); opacity: 1; }
.meta .tick.fail { color: var(--danger); opacity: 1; }
.bubble.media-only .meta { position: absolute; right: 8px; bottom: 7px; margin: 0; padding: 3px 7px; border-radius: 10px; background: rgba(0,0,0,.45); color: #fff; float: none; top: auto; height: auto; }
.msg.out .bubble.media-only .meta { color: #fff; }
.bubble.media-only .meta .tick.read { color: #7fd6ff; }
.chev { position: absolute; top: 3px; right: 4px; width: 24px; height: 22px; border-radius: 50%; display: none; place-items: center; color: var(--text-2); background: linear-gradient(90deg, transparent, var(--c) 40%); z-index: 2; }
.chev .ico { width: 18px; height: 18px; }
.bubble:hover .chev { display: grid; }
.bubble.media-only .chev { color: #fff; background: rgba(0,0,0,.35); }

.quote { display: flex; margin: 0 0 4px; border-radius: 4px 8px 8px 4px; overflow: hidden; background: var(--reply-in); cursor: pointer; }
.msg.out .quote { background: var(--reply-out); }
.quote::before { content: ""; width: 3px; background: var(--accent); flex: none; }
.msg.out .quote::before { background: var(--out-accent); }
.quote .q { padding: 4px 9px; min-width: 0; }
.quote .qn { font-size: 13.5px; font-weight: 500; color: var(--accent-strong); }
.msg.out .quote .qn { color: var(--out-accent); }
.msg.out .bubble .text a { color: var(--out-link); }
.quote .qt { font-size: 13.5px; color: var(--text-2); display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote .qt .ico { width: 14px; height: 14px; }

.media { display: block; margin: -2px -4px 4px; border-radius: 8px; overflow: hidden; position: relative; cursor: zoom-in; background: rgba(0,0,0,.08); }
.media img, .media video { display: block; max-width: 100%; width: auto; height: auto; max-height: 340px; min-width: 180px; }
.media video { cursor: default; background: #000; }
.media.uploading::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.ring { position: absolute; z-index: 2; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: rgba(255,255,255,.28); }
.ring .fg { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .15s; }

.file { display: flex; align-items: center; gap: 11px; padding: 9px 10px; margin: -1px -2px 4px; border-radius: 7px; background: var(--reply-in); min-width: 230px; text-decoration: none; color: inherit; position: relative; }
.msg.out .file { background: var(--reply-out); }
.file .fi { width: 44px; height: 44px; border-radius: 50%; background: var(--btn-bg); color: #fff; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; letter-spacing: .02em; }
.file .fi.pdf { background: #e5493a; } .file .fi.doc { background: #2b6cd4; } .file .fi.xls { background: #1f9d55; } .file .fi.ppt { background: #e07a1f; } .file .fi.zip { background: #8a6fd1; }
.file .fn { min-width: 0; flex: 1; }
.file .fn b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.file .fn span { font-size: 12px; color: var(--text-2); }
.file .dl { color: var(--text-2); }
.file:hover .dl { color: var(--accent-strong); }

.voice { display: flex; align-items: center; gap: 10px; min-width: 250px; padding: 2px 2px 4px; }
.voice .pp { width: 40px; height: 40px; border-radius: 50%; background: var(--btn-bg); color: #fff; display: grid; place-items: center; flex: none; }
.voice .pp .ico { width: 18px; height: 18px; }
.voice .wave { flex: 1; height: 28px; display: flex; align-items: center; gap: 2px; cursor: pointer; }
.voice .wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--text-2); opacity: .45; }
.voice .wave i.on { background: var(--accent-strong); opacity: 1; }
.msg.out .voice .pp { background: var(--out-accent); color: var(--bubble-out); }
.msg.out .voice .wave i.on { background: var(--out-accent); }
.voice .dur { font-size: 12px; color: var(--text-2); min-width: 34px; }

.to-bottom { position: absolute; right: 22px; bottom: 82px; z-index: 4; width: 44px; height: 44px; border-radius: 50%; background: var(--panel); color: var(--text-2); box-shadow: var(--pop-shadow); display: grid; place-items: center; }
.to-bottom .badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }

/* ---------- composer ---------- */
.composer { position: relative; z-index: 3; flex: none; padding: 6px max(10px, calc((100% - 780px) / 2)) calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; }
.composer .field { flex: 1; background: var(--input-bg); border-radius: 24px; box-shadow: var(--shadow); display: flex; align-items: flex-end; padding: 2px 4px; min-width: 0; }
.composer textarea { flex: 1; border: 0; background: transparent; resize: none; max-height: 140px; min-height: 44px; padding: 12px 6px; line-height: 20px; outline: none; min-width: 0; }
.composer textarea::placeholder { color: var(--text-2); }
.composer .icon-btn { flex: none; width: 44px; height: 44px; }
.send { width: 48px; height: 48px; border-radius: 50%; background: var(--btn-bg); color: #fff; display: grid; place-items: center; flex: none; box-shadow: var(--shadow); transition: background .15s, transform .1s; }
.send:hover { background: var(--btn-hover); }
.send:active { transform: scale(.94); }
.reply-bar { position: relative; z-index: 3; padding: 8px max(10px, calc((100% - 780px) / 2)) 0; display: flex; align-items: stretch; gap: 6px; }
.reply-bar .quote { flex: 1; margin: 0; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); cursor: default; }
.reply-bar .icon-btn { background: var(--panel); box-shadow: var(--shadow); align-self: center; }
.rec { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--input-bg); border-radius: 24px; box-shadow: var(--shadow); height: 48px; padding: 0 12px; }
.rec .led { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: pulse 1s ease-in-out infinite; }
.rec .t { font-variant-numeric: tabular-nums; min-width: 42px; }
.hint { color: var(--text-2); font-size: 13px; margin: 0 0 8px; }
.rec .hint { color: var(--text-2); font-size: 13px; flex: 1; }

.pop { position: absolute; z-index: 60; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(14px); border-radius: 12px; box-shadow: var(--pop-shadow); padding: 4px; min-width: 200px; }
.pop button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 8px 12px; text-align: left; border-radius: 8px; }
.pop button:hover { background: var(--panel-2); }
.pop button .ico { width: 20px; height: 20px; color: var(--text-2); }
.pop button.danger { color: var(--danger); } .pop button.danger .ico { color: var(--danger); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.attach-menu { bottom: 64px; left: max(10px, calc((100% - 780px) / 2)); padding: 6px; display: grid; gap: 2px; }
.attach-menu .tint { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.attach-menu .tint .ico { color: #fff; width: 19px; height: 19px; }
.emoji-pop { bottom: 64px; left: max(10px, calc((100% - 780px) / 2)); width: min(340px, calc(100% - 20px)); padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 260px; overflow-y: auto; }
.emoji-pop button { padding: 4px 0; justify-content: center; font-size: 22px; border-radius: 8px; }

.placeholder { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; text-align: center; padding: 30px; background: transparent; pointer-events: none; }
.placeholder .mark, .placeholder h2 { display: none; }
.placeholder p { display: inline-block; margin: 0; padding: 6px 16px; border-radius: 16px; background: var(--glass); color: #fff; font-size: 14.5px; font-weight: 500; backdrop-filter: blur(6px); }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(440px, 100%); max-height: min(640px, 92vh); background: var(--panel); border-radius: 14px; box-shadow: var(--pop-shadow); display: flex; flex-direction: column; overflow: hidden; }
.modal.wide { width: min(560px, 100%); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px 22px; }
.modal-head h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 500; }
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.modal-foot { padding: 10px 16px 14px; display: flex; justify-content: flex-end; gap: 8px; }
.btn { height: 42px; padding: 0 22px; border-radius: 10px; background: var(--btn-bg); color: #fff; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { background: var(--btn-hover); }
.btn.ghost { background: transparent; color: var(--accent-strong); }
.btn.ghost:hover { background: var(--panel-2); }
.btn:disabled { opacity: .55; cursor: default; }
.field-l { display: block; margin: 12px 0 5px; font-size: 13px; color: var(--text-2); }
.field-l:first-child { margin-top: 0; }
.fld { width: 100%; height: 44px; border: 1px solid var(--field-line); border-radius: 10px; background: var(--input-bg); padding: 0 12px; outline-offset: 0; }
.fld:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 1px var(--accent); }
.note { font-size: 12.5px; color: var(--text-2); margin: 6px 0 0; }
.prow { display: flex; align-items: center; }
.prow .person { flex: 1; min-width: 0; }
.prow .icon-btn { flex: none; margin-right: 10px; }
.list-h { padding: 12px 20px 4px; font-size: 14px; font-weight: 500; color: var(--accent-strong); }
.row .at { flex: none; color: var(--accent-strong); font-weight: 700; font-size: 15px; }
.mention-pop { position: absolute; left: 12px; right: 12px; bottom: 100%; max-height: 260px; overflow: auto; background: var(--panel); border-radius: 12px 12px 0 0; box-shadow: var(--pop-shadow); padding: 4px 0; z-index: 8; }
.mention-pop .person.sel { background: var(--row-hover); }
a.mention { color: var(--accent-strong); font-weight: 600; text-decoration: none; }
a.mention:hover { text-decoration: underline; }
a.mention.me { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 4px; padding: 0 3px; }
.people { margin: 10px -20px -16px; }
.person { display: flex; align-items: center; gap: 12px; padding: 8px 20px; width: 100%; text-align: left; }
.person:hover { background: var(--row-hover); }
.person .n { font-weight: 500; } .person .e { font-size: 13px; color: var(--text-2); }
.preview-box { background: var(--panel-2); border-radius: 10px; min-height: 160px; display: grid; place-items: center; padding: 10px; margin-bottom: 14px; }
.preview-box img, .preview-box video { max-width: 100%; max-height: 300px; border-radius: 6px; }
.queue { display: grid; gap: 6px; margin-bottom: 12px; }
.queue .q { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--panel-2); border-radius: 8px; font-size: 13.5px; }
.queue .q span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue .q small { color: var(--text-2); }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(5,10,13,.94); display: flex; flex-direction: column; }
.lightbox .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: #fff; }
.lightbox .bar .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lightbox .bar .icon-btn { color: #fff; } .lightbox .bar .icon-btn:hover { background: rgba(255,255,255,.12); }
.lightbox .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 20px 20px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; }

.toasts { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { background: rgba(30,36,42,.94); color: #fff; padding: 10px 16px; border-radius: 12px; box-shadow: var(--pop-shadow); max-width: min(520px, 92vw); animation: tin .2s ease-out; }
.toast.err { background: #8c2531; color: #fff; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.dropzone { position: absolute; inset: 0; z-index: 30; background: color-mix(in srgb, var(--accent) 22%, transparent); backdrop-filter: blur(2px); border: 3px dashed var(--accent); border-radius: 12px; display: grid; place-items: center; font-size: 20px; font-weight: 600; pointer-events: none; }

/* ---------- login ---------- */
.login { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 32px 16px; background: var(--panel); }
.login .hero { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 420px; }
.brand { width: 116px; height: 116px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin-bottom: 22px; }
[data-theme="dark"] .brand { background: var(--btn-bg); }
.brand .ico { width: 58px; height: 58px; margin-right: 4px; }
.login .hero h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; font-weight: 500; }
.login .hero p { margin: 0; color: var(--text-2); max-width: 26em; font-size: 15px; }
.login .box { width: min(360px, 100%); }
.login .box form { width: 100%; }
.login h2 { margin: 0 0 4px; font-size: 20px; font-weight: 500; text-align: center; }
.login .sub { color: var(--text-2); margin: 0 0 18px; text-align: center; font-size: 14px; }
.login .btn { width: 100%; margin-top: 18px; height: 46px; }
.login .err { margin-top: 12px; color: var(--danger); font-size: 13.5px; min-height: 18px; }
.login details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.login summary { cursor: pointer; color: var(--text-2); font-size: 13.5px; }
.pass-box { position: relative; }
.pass-box .fld { padding-right: 46px; }
.eye { position: absolute; right: 4px; top: 2px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); }
.eye:hover { background: var(--panel-2); color: var(--text); }
.eye .ico { width: 22px; height: 22px; }
.theme-fab { position: fixed; top: 14px; right: 14px; z-index: 5; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .chat { position: absolute; inset: 0; z-index: 10; transform: translateX(100%); transition: transform .22s ease; }
  .app.has-chat .chat { transform: none; }
  .back { display: grid; }
  .placeholder { display: none; }
  .bubble { max-width: 86%; }
  .to-bottom { bottom: 76px; right: 14px; }
  .login .hero p { display: none; }
  .brand { width: 92px; height: 92px; margin-bottom: 14px; }
  .brand .ico { width: 46px; height: 46px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* groups */
.fld.area { height: auto; min-height: 42px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 16px; background: var(--panel-2); font-size: 13.5px; }
.chip button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); }
.chip button:hover { background: var(--line); }
.chip .ico { width: 14px; height: 14px; }
.person .tick-box { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--field-line); display: grid; place-items: center; color: transparent; flex: none; }
.person.sel .tick-box { background: var(--btn-bg); border-color: var(--btn-bg); color: #fff; }
.person .tick-box .ico { width: 14px; height: 14px; }
.person.disabled { opacity: .5; cursor: default; }
.av.icon { background: var(--btn-bg) !important; }
.av.icon .ico { width: 22px; height: 22px; }
.g-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin: -4px -20px 8px; padding: 0 20px 16px; }
.g-photo { position: relative; }
.g-photo .cam { position: absolute; right: -2px; bottom: -2px; width: 34px; height: 34px; border-radius: 50%; background: var(--btn-bg); color: #fff; display: grid; place-items: center; border: 3px solid var(--panel); }
.g-photo .cam .ico { width: 16px; height: 16px; }
.g-name { font-size: 22px; font-weight: 600; margin-top: 10px; display: flex; align-items: center; gap: 4px; max-width: 100%; }
.g-name span { overflow-wrap: anywhere; }
.g-desc { color: var(--text-2); display: flex; align-items: center; gap: 4px; max-width: 100%; }
.g-desc span { overflow-wrap: anywhere; white-space: pre-wrap; }
.g-sub { font-size: 13px; color: var(--text-2); }
.edit-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); flex: none; }
.edit-btn:hover { background: var(--panel-2); }
.edit-btn .ico { width: 16px; height: 16px; }
.inline-edit { display: flex; gap: 6px; align-items: center; width: 100%; }
.inline-edit .fld { height: 38px; }
.g-add { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 0; text-align: left; font-weight: 500; color: var(--accent-strong); }
.g-add .av { width: 40px; height: 40px; }
.g-add:hover { background: var(--row-hover); }
.g-members h3 { margin: 12px 0 4px; font-size: 13.5px; font-weight: 500; color: var(--text-2); }
.m-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.m-row .t { flex: 1; min-width: 0; }
.m-row .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-row .e { font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; color: var(--accent-strong); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); flex: none; }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.chat-head .who.hit, .chat-head .av.hit { cursor: pointer; }

/* profile */
.p-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; margin-bottom: 14px; }
.p-name { font-size: 22px; font-weight: 600; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.p-sub { color: var(--text-2); font-size: 14px; overflow-wrap: anywhere; } .p-sub.live { color: var(--accent-strong); }
.p-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.p-stat { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 12px; background: var(--panel-2); gap: 2px; }
button.p-stat:hover { background: var(--row-hover); }
.p-stat b { font-size: 18px; } .p-stat span { font-size: 12.5px; color: var(--text-2); }
.p-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
.p-actions .btn { height: 38px; padding: 0 16px; }
.btn.outline { background: transparent; color: var(--accent-strong); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.outline:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.btn.outline.on { color: #e0557d; box-shadow: inset 0 0 0 1.5px #e0557d; }
.btn .ico { width: 18px; height: 18px; }
.tabs { display: flex; gap: 2px; box-shadow: inset 0 -1px 0 var(--line); margin: 0 -20px; padding: 0 12px; overflow-x: auto; }
.tab { padding: 11px 14px 10px; font-weight: 500; color: var(--text-2); border-bottom: 3px solid transparent; border-radius: 3px 3px 0 0; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent-strong); border-bottom-color: var(--accent); }
.p-pane { padding-top: 8px; }
.p-pane .person { padding-left: 0; padding-right: 0; }
.p-views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 0 10px; text-align: center; }
.p-views b { display: block; font-size: 17px; } .p-views span { font-size: 12.5px; color: var(--text-2); }
.stars { display: inline-flex; gap: 2px; }
.stars button, .stars.ro > span { display: inline-grid; place-items: center; color: var(--field-line); }
.stars button { width: 36px; height: 36px; border-radius: 50%; }
.stars button:hover { background: var(--panel-2); }
.stars .on, .stars.ro > span.on { color: #f5a623; }
.stars .ico { width: 24px; height: 24px; } .stars.ro .ico { width: 16px; height: 16px; }
.review-form { padding: 6px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.review-form .field-l { margin: 4px 0 4px; }
.review-form .fld { margin-top: 8px; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.review { padding: 10px 0; border-bottom: 1px solid var(--line); }
.review p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .sender.hit { cursor: pointer; } .bubble .sender.hit:hover { text-decoration: underline; }
.m-row.hit { cursor: pointer; }
@media (max-width: 520px) { .p-stats, .p-views { grid-template-columns: repeat(2, 1fr); } }

/* reactions */
.bubble.has-reacts { margin-bottom: 15px; }
.reacts { position: absolute; bottom: -14px; display: flex; align-items: center; gap: 3px; z-index: 1; }
.msg.out .reacts { right: 8px; } .msg.in .reacts { left: 8px; }
.react-chip, .react-who { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--panel); border: 1px solid transparent; box-shadow: var(--shadow); font-size: 13px; font-weight: 500; line-height: 1; color: var(--accent-strong); }
.react-chip .em { font-size: 14px; }
.react-chip.mine { background: var(--btn-bg); color: #fff; }
.react-chip:hover, .react-who:hover { border-color: var(--accent); }
.react-who { padding: 0 7px; }
.react-btn { align-self: center; width: 28px; height: 28px; margin: 0 4px; border-radius: 50%; display: none; place-items: center; color: var(--text-2); flex: none; }
.react-btn .ico { width: 18px; height: 18px; }
.react-btn:hover { background: var(--row-hover); }
.msg:hover .react-btn, .react-btn:focus-visible { display: grid; }
.react-pop { padding: 4px; min-width: 0; }
.react-row, .react-grid { display: flex; align-items: center; gap: 2px; padding: 4px 6px; }
.react-row button { width: 38px; height: 38px; padding: 0; justify-content: center; font-size: 24px; border-radius: 50%; flex: none; }
.react-row button .ico { width: 20px; height: 20px; }
.react-row button.on, .react-grid button.on { background: var(--row-hover); box-shadow: inset 0 0 0 2px var(--accent); }
.react-grid { display: grid; grid-template-columns: repeat(8, 1fr); max-height: 220px; overflow-y: auto; width: 320px; max-width: 80vw; }
.react-grid button { padding: 4px 0; justify-content: center; font-size: 22px; border-radius: 8px; }
.pop > .react-row { border-bottom: 1px solid var(--line); margin-bottom: 4px; padding: 2px 10px 6px; }
.big-em { font-size: 22px; margin-left: auto; }

/* status */
body.sv-open .scrim { z-index: 80; }
body.sv-open .toasts, body.sv-open .toast { z-index: 90; }
.status-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.status-pane .tabs { padding: 0 8px; margin: 0; }
.status-pane .tab .badge { margin-left: 6px; position: static; display: inline-grid; }
.status-body { flex: 1; min-height: 0; overflow-y: auto; }
.srow { display: flex; align-items: center; gap: 14px; width: calc(100% - 12px); margin: 0 6px; padding: 8px 12px; border-radius: 12px; text-align: left; }
.srow:hover { background: var(--row-hover); }
.srow .body { min-width: 0; flex: 1; }
.srow .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .e { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-ring { padding: 3px; border-radius: 50%; border: 2.5px solid var(--field-line); flex: none; }
.s-ring.new { border-color: var(--accent); }
.s-ring .av { width: 46px; height: 46px; }
.sthumb { width: 52px; height: 52px; border-radius: 12px; flex: none; background: var(--panel-2) center / cover; display: grid; place-items: center; color: var(--text-2); overflow: hidden; font-size: 10px; line-height: 1.15; padding: 4px; text-align: center; word-break: break-word; }
.sthumb.txt { color: #fff; font-weight: 600; }
.sthumb.icon { background: #2b3a42; color: #fff; } .sthumb.icon.audio { background: #7048e8; }
.sthumb.add { background: var(--btn-bg); color: #fff; border-radius: 50%; } .sthumb.add .ico { width: 26px; height: 26px; }
.sthumb .ico { width: 24px; height: 24px; }
.counts { display: flex; gap: 12px; margin-top: 3px; color: var(--text-2); font-size: 12.5px; }
.counts .cc { display: inline-flex; align-items: center; gap: 3px; }
.counts .ico { width: 14px; height: 14px; }
.note-pad { padding: 14px 20px; color: var(--text-2); font-size: 13.5px; }
.more-btn { display: block; margin: 8px auto 16px; padding: 8px 18px; border-radius: 18px; color: var(--accent-strong); font-weight: 600; }
.more-btn:hover { background: var(--row-hover); }
.sc-modes { margin: -6px -4px 12px; }
.sc-stage { display: grid; gap: 10px; }
.sc-text { width: 100%; min-height: 200px; border-radius: 12px; padding: 24px; color: #fff; font-size: 24px; font-weight: 500; text-align: center; resize: none; border: 0; outline: none; }
.sc-text::placeholder { color: rgba(255,255,255,.7); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
.sw.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text); }
.sc-pick { display: grid; place-items: center; gap: 8px; min-height: 160px; border: 2px dashed var(--field-line); border-radius: 12px; color: var(--text-2); }
.sc-pick .ico { width: 34px; height: 34px; }
.sc-pick:hover { border-color: var(--accent); color: var(--accent-strong); }
.sc-prev { display: grid; gap: 8px; justify-items: center; }
.sc-prev img, .sc-prev video { max-width: 100%; max-height: 300px; border-radius: 12px; }
.sc-prev audio { width: 100%; }
.link { color: var(--accent-strong); font-size: 13px; }
body.sv-open { overflow: hidden; }
.sv { position: fixed; inset: 0; z-index: 70; background: rgba(8,12,14,.96); display: grid; place-items: center; }
.sv-stage { position: relative; width: min(440px, 100vw); height: min(100vh, 860px); background: #101517; overflow: hidden; display: flex; flex-direction: column; border-radius: 14px; }
@media (max-width: 520px) { .sv-stage { border-radius: 0; height: 100dvh; } }
.sv-bars { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; gap: 4px; z-index: 5; }
.sv-bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.sv-bar i { display: block; height: 100%; background: #fff; }
.sv-top { position: absolute; top: 16px; left: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 0 10px; z-index: 6; color: #fff; background: linear-gradient(rgba(0,0,0,.55), transparent); padding-bottom: 18px; padding-top: 4px; }
.sv-top .grow { flex: 1; }
.sv-who { display: flex; align-items: center; gap: 10px; color: #fff; text-align: left; }
.sv-who b { display: block; font-size: 15px; } .sv-who span { font-size: 12.5px; opacity: .8; }
.sv-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.sv-btn:hover { background: rgba(255,255,255,.14); }
.sv-btn.on { color: #ff5a79; } .sv-btn.sm { width: 32px; height: 32px; }
.sv-btn .ico { width: 22px; height: 22px; }
.sv-emoji { font-size: 22px; line-height: 1; }
.sv-media { position: absolute; inset: 0; display: grid; place-items: center; background: #000; }
.sv-img, .sv-vid { width: 100%; height: 100%; object-fit: contain; }
.sv-text { width: 100%; height: 100%; display: grid; place-items: center; padding: 36px 28px; }
.sv-text p { margin: 0; color: #fff; font-weight: 600; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.25; }
.sv-audio { display: grid; gap: 18px; justify-items: center; width: 100%; padding: 0 28px; color: #fff; }
.sv-audio .disc { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #7048e8, #d6336c); }
.sv-audio .disc .ico { width: 64px; height: 64px; }
.sv-audio .fn { font-size: 14px; opacity: .85; text-align: center; overflow-wrap: anywhere; }
.sv-audio audio { width: 100%; }
.sv-cap { position: absolute; left: 0; right: 0; bottom: 84px; padding: 10px 18px; color: #fff; text-align: center; font-size: 15px; background: linear-gradient(transparent, rgba(0,0,0,.6)); white-space: pre-wrap; z-index: 3; }
.sv-zone { position: absolute; top: 70px; bottom: 150px; width: 34%; z-index: 4; }
.sv-zone.prev { left: 0; } .sv-zone.next { right: 0; width: 66%; }
.sv-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; gap: 4px; padding: 26px 10px 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.sv-reply { flex: 1; min-width: 0; }
.sv-input { width: 100%; height: 42px; border-radius: 21px; padding: 0 16px; background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.28); outline: none; font-size: 14.5px; }
.sv-input::placeholder { color: rgba(255,255,255,.7); }
.sv-input:focus { border-color: #fff; }
.sv-statbar { display: flex; align-items: center; gap: 18px; width: 100%; height: 44px; padding: 0 14px; border-radius: 22px; background: rgba(255,255,255,.14); color: #fff; }
.sv-stat { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; }
.sv-stat .ico { width: 18px; height: 18px; }
.sv-more { margin-left: auto; font-size: 13px; opacity: .85; }
.sv-react-pop { position: absolute; right: 10px; bottom: 66px; display: flex; gap: 2px; padding: 6px 8px; border-radius: 26px; background: var(--panel); box-shadow: var(--pop-shadow); }
.sv-react-pop button { width: 38px; height: 38px; border-radius: 50%; font-size: 24px; }
.sv-react-pop button:hover { background: var(--panel-2); } .sv-react-pop button.on { box-shadow: inset 0 0 0 2px var(--accent); }
.sv-drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 70%; z-index: 20; background: var(--panel); color: var(--text); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.35); }
.sv-dhead { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 18px; border-bottom: 1px solid var(--line); }
.sv-dhead .sv-btn, .sv-drawer .sv-btn { color: var(--text-2); }
.sv-dhead .sv-btn:hover, .sv-drawer .sv-btn:hover { background: var(--row-hover); }
.sv-dbody { flex: 1; min-height: 0; overflow-y: auto; }
.sv-dfoot { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.sv-dfoot .sv-input { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.sv-dfoot .sv-input::placeholder { color: var(--text-2); }
.sv-clist, .sv-plist { padding: 4px 0; }
.sv-c { display: flex; gap: 10px; padding: 8px 14px; align-items: flex-start; }
.sv-c .cb { flex: 1; min-width: 0; } .sv-c .cb b { font-size: 14px; } .sv-c .cb p { margin: 1px 0; overflow-wrap: anywhere; white-space: pre-wrap; } .sv-c .cb span { font-size: 12px; color: var(--text-2); }
.sv-cwho { flex: none; }
.sv-break { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 18px; font-size: 16px; }
.sv-ins .tabs { padding: 0 10px; position: sticky; top: 0; background: var(--panel); z-index: 1; }

/* group invites */
.inv { display: grid; gap: 12px; }
.qr-box { justify-self: center; padding: 10px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px var(--line), var(--shadow); line-height: 0; }
.qr { width: 216px; height: 216px; image-rendering: pixelated; border-radius: 8px; }
.inv-lead { margin: 0; color: var(--text-2); }
.inv-lead.center { text-align: center; }
.inv .fld[readonly] { font-size: 13.5px; }
.inv-meta { text-align: center; font-size: 13px; color: var(--text-2); }
.inv-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.inv-act { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; white-space: nowrap; padding: 8px 4px; border-radius: 12px; font-size: 13px; color: var(--text); }
.inv-act:hover { background: var(--row-hover); }
.inv-act .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--btn-bg); color: #fff; }
.inv-act .ic .ico { width: 22px; height: 22px; }
.scan-view { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #0b1117; }
.scan-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; inset: 14%; border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.28); border: 3px solid rgba(255,255,255,.9); pointer-events: none; }
.scan-view.off .scan-frame { display: none; }
.scan-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 22px; text-align: center; color: #fff; font-size: 14px; background: rgba(0,0,0,.35); }
.scan-note { text-align: center; margin: 10px 0 0; }
.scan-or { display: flex; align-items: center; gap: 12px; margin: 12px 0; color: var(--text-2); font-size: 13px; }
.scan-or::before, .scan-or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.scan-row { display: flex; gap: 8px; align-items: center; justify-content: center; }
.scan-row .fld { flex: 1; min-width: 0; }
.join-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 6px 0 4px; }
.join-hero .g-name { margin-top: 10px; justify-content: center; }
.join-hero .btn { margin-top: 18px; min-width: 200px; }
select.fld { appearance: auto; }
</style>
</head>

// ---------- formatting ----------
function toDate(v) {
  if (!v) return null;
  if (Array.isArray(v)) return new Date(v[0], v[1] - 1, v[2], v[3] || 0, v[4] || 0, v[5] || 0);
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const fmtTime = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function listStamp(d) {
  if (!d) return '';
  const now = new Date();
  if (sameDay(d, now)) return fmtTime(d);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, y)) return 'Yesterday';
  if (now - d < 6 * 864e5) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function dayLabel(d) {
  const now = new Date();
  if (sameDay(d, now)) return 'Today';
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, y)) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function lastSeenText(d) {
  if (!d) return '';
  const now = new Date();
  if (sameDay(d, now)) return 'last seen today at ' + fmtTime(d);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (sameDay(d, y)) return 'last seen yesterday at ' + fmtTime(d);
  return 'last seen ' + d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' at ' + fmtTime(d);
}
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function fmtDur(s) {
  if (!isFinite(s) || s < 0) s = 0;
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

// ---------- people ----------
function userName(u) {
  if (!u) return 'Unknown';
  // Full name first, then whatever else the profile has.
  const full = [u.firstName, u.lastName].filter(Boolean).join(' ').trim();
  return full || u.fullName || u.displayName || u.username || u.email || 'Unknown';
}
// True when u is the signed-in user. Compares id, email and username, and the
// email in the token, so the caller is hidden even if one of them is missing.
function tokenSub() {
  try { return JSON.parse(atob(S.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub || ''; } catch (e) { return ''; }
}
function isMe(u) {
  if (!u) return false;
  const eq = (a, b) => !!a && !!b && String(a).toLowerCase() === String(b).toLowerCase();
  const me = S.me || {};
  return eq(u.id, me.id) || eq(u.email, me.email) || eq(u.username, me.username) || eq(u.email, tokenSub());
}
// Seven peer colours, the same idea Telegram uses: one gradient for avatars
// (.av.p0 to .av.p6) and one readable shade for names (--pc0 to --pc6).
const PEER_COLORS = 7;
function peerIndex(key) {
  let x = 0; const s = String(key || '?');
  for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0;
  return x % PEER_COLORS;
}
function colorFor(key) { return 'var(--pc' + peerIndex(key) + ')'; }
function initials(name) {
  const p = String(name || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function avatar(name, photo, key, size, online) {
  const a = h('div', { class: 'av p' + peerIndex(key || name) + (size ? ' ' + size : '') });
  if (photo) {
    a.style.backgroundImage = 'url("' + String(photo).replace(/"/g, '%22') + '")';
    a.textContent = '';
    // fall back to initials if the picture fails to load
    const probe = new Image();
    probe.onerror = () => { a.style.backgroundImage = ''; a.textContent = initials(name); };
    probe.src = photo;
  } else a.textContent = initials(name);
  if (online) a.append(h('span', { class: 'dot' }));
  return a;
}

function chatTitle(c) { return c.chatType === 'GROUP' ? (c.groupName || 'Group') : userName(c.otherUser) ; }
function chatPhoto(c) { return c.chatType === 'GROUP' ? c.groupPhotoUrl : c.otherUser && c.otherUser.profilePictureUrl; }
function otherId(c) {
  if (c.chatType === 'GROUP') return null;
  if (c.otherUser && c.otherUser.id) return c.otherUser.id;
  return (c.participantIds || []).find(id => S.me && id !== S.me.id) || null;
}
function presenceOf(c) {
  const id = otherId(c);
  if (!id) return { online: false, lastSeen: null };
  const p = S.presence[id];
  if (p) return p;
  return { online: !!(c.otherUser && c.otherUser.online != null ? c.otherUser.online : c.online), lastSeen: toDate((c.otherUser && c.otherUser.lastSeen) || c.lastSeen) };
}

// ---------- API ----------
class ApiError extends Error {
  constructor(status, message, data) { super(message); this.status = status; this.data = data; }
}
async function api(path, opt = {}) {
  const base = opt.base || S.cfg.api;
  const headers = { ...(opt.headers || {}) };
  if (S.token && !opt.anon) headers.Authorization = 'Bearer ' + S.token;
  let body;
  if (opt.json !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opt.json); }
  else if (opt.form) body = opt.form;
  let res;
  try { res = await fetch(base + path, { method: opt.method || 'GET', headers, body }); }
  catch (e) { throw new ApiError(0, 'Cannot reach ' + base + '. Is the service running, and is the address right?'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const msg = (data && data.message) || (typeof data === 'string' && data) || res.statusText || ('HTTP ' + res.status);
    throw new ApiError(res.status, msg, data);
  }
  return data;
}
function uploadFile(file, chatId, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', S.cfg.api + '/api/attachments');
    x.setRequestHeader('Authorization', 'Bearer ' + S.token);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let d = null; try { d = JSON.parse(x.responseText); } catch (e) { /* not json */ }
      if (x.status >= 200 && x.status < 300) resolve(d);
      else reject(new ApiError(x.status, (d && d.message) || 'Upload failed (' + x.status + ')', d));
    };
    x.onerror = () => reject(new ApiError(0, 'Upload failed: cannot reach the service'));
    const f = new FormData();
    f.append('file', file, file.name || 'file');
    f.append('chatId', chatId);
    x.send(f);
  });
}

  if (mime.startsWith('video/')) return 'video';

    frag.append(h('a', { class: 'mention' + (S.me && who.id === S.me.id ? ' me' : ''), href: '#', onclick: e => { e.preventDefault(); openProfile(who.id); } }, m[0]));
    last = m.index + m[0].length;

}

    dur.textContent = fmtDur(audio ? (audio.paused && !audio.currentTime && d ? d : audio.currentTime) : 0);

async function loadMessages(chatId, reset) {
  const b = bucket(chatId);
  if (b.loading) return;
  b.loading = true;
  try {
    const page = reset ? 0 : b.page + 1;
    const rows = await api('/api/messages/chat/' + encodeURIComponent(chatId) + '?page=' + page + '&size=40');
    const batch = (rows || []).slice().reverse();
    b.more = (rows || []).length >= 40;
    b.page = page;
    if (reset) {
      const pendings = b.list.filter(x => x._pending || x._failed);
      b.list = []; b.ids = new Set();
      for (const m of batch) { mergeEvents(m); b.list.push(m); b.ids.add(m.id); }
      b.list.push(...pendings);
    } else {
      const fresh = batch.filter(m => !b.ids.has(m.id));
      fresh.forEach(m => { mergeEvents(m); b.ids.add(m.id); });

  if (existing) {

    Object.assign(existing, m, { _delivered: existing._delivered });
    if (m.chatId === S.active) rebuildMsg(existing);
    const c = chatById(m.chatId); if (c && c.lastMessage && c.lastMessage.id === m.id) c.lastMessage = existing;
    renderList();
    return;
  }
  mergeEvents(m);
  b.list.push(m); b.ids.add(m.id);
  noteChatActivity(m);
  const mine = S.me && m.senderId === S.me.id;
  if (m.chatId === S.active) {
    insertMessage(m);
    if (!mine) {
      if (document.visibilityState === 'visible') markRead(m);

  } else if (!mine) {
    S.unread[m.chatId] = (S.unread[m.chatId] || 0) + 1;

  if (c && S.typing[c.id] && !mine) { clearTimeout(S.typing[c.id]); delete S.typing[c.id]; if (m.chatId === S.active) renderHeader(); }

function pendingMsg(chatId, fields) {
  const reply = S.replyTo && S.replyTo.chatId === chatId ? S.replyTo : null;
  return Object.assign({
    _tmpId: 'tmp-' + (++S.tmp), _pending: true, chatId,
    senderId: S.me.id, senderName: userName(S.me), status: 'SENDING', readBy: [],
    createdAt: new Date().toISOString(), messageType: 'TEXT',
    replyToMessageId: reply ? reply.id : null,
    replyPreview: reply ? { messageId: reply.id, senderId: reply.senderId, senderName: reply.senderId === S.me.id ? 'You' : reply.senderName, content: reply.content, messageType: reply.messageType, mimeType: reply.mimeType, fileName: reply.fileName, mediaUrl: reply.mediaUrl, attachmentId: reply.attachmentId } : null
  }, fields);
}
function pushPending(m) {
  const b = bucket(m.chatId);
  b.list.push(m);
  noteChatActivity(m);

  renderList();
}
function settle(temp, real) {
  const b = bucket(temp.chatId);
  const i = b.list.indexOf(temp);
  mergeEvents(real);
  if (b.ids.has(real.id)) {                // the live echo got there first
    if (i >= 0) b.list.splice(i, 1);
    msgEl(temp)?.remove();
  } else {
    if (i >= 0) b.list[i] = real; else b.list.push(real);
    b.ids.add(real.id);
    const el = msgEl(temp);
    if (el) el.replaceWith(buildMsg(real, prevOf(b, real)));
  }
  if (temp._local) setTimeout(() => URL.revokeObjectURL(temp._local), 4000);
  noteChatActivity(real);
  renderList();
}
function failed(temp, err) {

  toast(err.message || 'Message not sent', true);
  const el = msgEl(temp);
  if (el) el.replaceWith(buildMsg(temp, prevOf(bucket(temp.chatId), temp)));
  renderList();
}
async function sendPayload(temp, payload) {
  try {
    const real = await api('/api/messages', { method: 'POST', json: payload });
    settle(temp, real);
  } catch (e) { temp._payload = payload; failed(temp, e); }
}
function retrySend(m) {
  if (!m._payload) { toast('Nothing to retry. Send it again.'); return; }
  m._failed = false; m._pending = true;
  const el = msgEl(m); if (el) el.replaceWith(buildMsg(m, prevOf(bucket(m.chatId), m)));
  sendPayload(m, m._payload);
}

function sendText() {
  if (S.editing) { saveEdit(); return; }
  const c = chatById(S.active); if (!c) return;
  const text = R.ta.value.trim();
  if (!text) return;
  R.ta.value = ''; S.drafts[c.id] = ''; autoGrow(); syncSendButton();
  const ids = mentionIdsFor(c.id, text);
  const temp = pendingMsg(c.id, { content: text, mentionedUserIds: ids });
  const payload = { chatId: c.id, content: text, replyToMessageId: temp.replyToMessageId || undefined, mentionedUserIds: ids.length ? ids : undefined };
  clearReply();
  pushPending(temp);
  sendPayload(temp, payload);
}

async function sendFileMessage(file, caption, chatId) {
  const mime = (file.type || '').toLowerCase();
  const type = mime.startsWith('image/') ? 'IMAGE' : mime.startsWith('video/') ? 'VIDEO' : mime.startsWith('audio/') ? 'VOICE' : 'DOCUMENT';
  const temp = pendingMsg(chatId, { content: caption || '', messageType: type, fileName: file.name, fileSize: file.size, _mime: mime || 'application/octet-stream', _local: URL.createObjectURL(file), _progress: 0 });
  const reply = temp.replyToMessageId;
  clearReply();
  pushPending(temp);
  try {
    const up = await uploadFile(file, chatId, p => {
      temp._progress = p;
      if (temp._ring) temp._ring._set(p);
      if (temp._sub) temp._sub.textContent = 'Uploading ' + Math.round(p * 100) + '%';
    });
    await sendPayload(temp, { chatId, content: caption || '', attachmentId: up.attachmentId, replyToMessageId: reply || undefined });
  } catch (e) {

  }
}
async function sendFiles(files, caption) {

  let first = true;

}

    if (url) { URL.revokeObjectURL(url); url = null; }

    qBox.replaceChildren(...queue.map((q, i) => h('div', { class: 'q' }, ico(q.type.startsWith('image/') ? 'image' : q.type.startsWith('video/') ? 'video' : 'file'), h('span', null, q.name), h('small', null, fmtSize(q.size)),
      h('button', { type: 'button', class: 'icon-btn', style: 'width:28px;height:28px', 'aria-label': 'Remove ' + q.name, onclick: () => { queue.splice(i, 1); redraw(); } }, ico('x')))));
    qBox.classList.toggle('hidden', queue.length < 2);

  };
  sendBtn.onclick = () => { const f = queue.slice(); const cap = caption.value.trim(); closeModal(); sendFiles(f, cap); };

// drag and drop
function setupDragDrop() {
  let depth = 0;
  const chat = R.chat;
  chat.addEventListener('dragenter', e => { if (!S.active || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); depth++; R.drop.classList.remove('hidden'); });
  chat.addEventListener('dragover', e => { if (S.active) e.preventDefault(); });
  chat.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) R.drop.classList.add('hidden'); });
  chat.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; R.drop.classList.add('hidden');
    if (!S.active) return;
    const files = [...(e.dataTransfer ? e.dataTransfer.files : [])];
    if (files.length) openSendDialog(files);
  });
}

let rec = null;
async function startRecording() {
  if (!S.active) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('This browser cannot record audio.', true); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast('Microphone access was blocked. Allow it in the address bar and try again.', true); return; }
  const mr = new MediaRecorder(stream);
  const chunks = [];
  const t0 = Date.now();
  const timer = h('span', { class: 't' }, '0:00');
  const tick = setInterval(() => { timer.textContent = fmtDur((Date.now() - t0) / 1000); }, 250);
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stop = send => {
    clearInterval(tick);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      endRecordingUi();
      if (send && chunks.length) {
        const type = mr.mimeType || 'audio/webm';
        const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
        const file = new File(chunks, 'voice-note-' + Date.now() + '.' + ext, { type: type.split(';')[0] });
        sendFiles([file], '');
      }
    };
    if (mr.state !== 'inactive') mr.stop();
  };
  rec = { stop };
  R.field.classList.add('hidden');
  R.recBar = h('div', { class: 'rec' },
    btn('icon-btn', 'Cancel recording', 'trash', () => stop(false)),
    h('span', { class: 'led' }), timer, h('span', { class: 'hint' }, 'Recording'));
  R.composer.insertBefore(R.recBar, R.sendBtn);
  R.sendBtn.replaceChildren(ico('send'));
  R.sendBtn.onclick = () => stop(true);
  mr.start();
}
function endRecordingUi() {
  rec = null;
  R.recBar?.remove(); R.recBar = null;
  R.field.classList.remove('hidden');
  R.sendBtn.onclick = onSendOrMic;
  syncSendButton();
}

// A searchable list of people with check marks and removable chips.
function memberPicker(excludeIds, onChange) {
  const exclude = new Set(excludeIds || []);
  const picked = new Map();     // id -> user
  const known = new Map();
  const input = h('input', { class: 'fld', type: 'search', placeholder: 'Search people by name or email', 'aria-label': 'Search people' });
  const chips = h('div', { class: 'chips' });
  const list = h('div', { class: 'people' });
  let timer = null, seq = 0;

  const drawChips = () => {
    chips.replaceChildren(...[...picked.values()].map(u => h('span', { class: 'chip' }, userName(u),
      h('button', { type: 'button', 'aria-label': 'Remove ' + userName(u), onclick: () => { picked.delete(u.id); drawChips(); drawList(lastRows); onChange(); } }, ico('x')))));
  };
  let lastRows = [];
  const drawList = users => {
    lastRows = users || [];
    const rows = lastRows.filter(u => u && u.id && !exclude.has(u.id) && !isMe(u));
    list.replaceChildren(...(rows.length ? rows.map(u => {
      const on = picked.has(u.id);
      return h('button', { class: 'person' + (on ? ' sel' : ''), type: 'button', 'aria-pressed': on ? 'true' : 'false',
        onclick: () => { on ? picked.delete(u.id) : picked.set(u.id, u); drawChips(); drawList(lastRows); onChange(); } },
        avatar(userName(u), u.profilePictureUrl, u.id, 'sm'),
        h('div', null, h('div', { class: 'n' }, userName(u)), h('div', { class: 'e' }, u.email || u.username || '')),
        h('span', { class: 'tick-box' }, ico('check')));
    }) : [h('div', { class: 'empty' }, h('p', null, 'No one found.'))]));
  };
  const load = async q => {
    const mine = ++seq;
    try {
      const users = q ? await api('/api/users/search?query=' + encodeURIComponent(q)) : await api('/api/users?page=0&size=50');
      if (mine !== seq) return;
      (users || []).forEach(u => known.set(u.id, u));
      drawList(users);
    } catch (e) { if (mine === seq) list.replaceChildren(h('div', { class: 'empty' }, h('p', null, e.message))); }
  };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(() => load(input.value.trim()), 260); };
  list.replaceChildren(h('div', { class: 'empty' }, h('p', null, 'Loading')));
  load('');
  return { nodes: [input, chips, list], ids: () => [...picked.keys()], count: () => picked.size, focus: () => input.focus() };
}

function editable(text, canEdit, opt, save) {
  const view = h('div', { class: opt.cls });
  const draw = () => {
    view.replaceChildren(h('span', null, text || opt.empty || ''));
    if (canEdit) view.append(h('button', { class: 'edit-btn', type: 'button', 'aria-label': opt.label, title: opt.label, onclick: edit }, ico('edit')));
  };
  const edit = () => {
    const field = opt.multi
      ? h('textarea', { class: 'fld area', rows: 2, maxlength: opt.max, 'aria-label': opt.label })
      : h('input', { class: 'fld', maxlength: opt.max, 'aria-label': opt.label });
    field.value = text || '';
    const done = async ok => {
      if (!ok) { draw(); return; }
      const v = field.value.trim();
      if (opt.required && !v) { toast('This cannot be empty.', true); return; }
      field.disabled = true;
      try { await save(v); } catch (e) { toast(e.message, true); draw(); }
    };
    field.onkeydown = e => { if (e.key === 'Enter' && !(opt.multi && e.shiftKey)) { e.preventDefault(); done(true); } if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    view.replaceChildren(h('div', { class: 'inline-edit' }, field, btn('edit-btn', 'Save', 'check', () => done(true)), btn('edit-btn', 'Cancel', 'x', () => done(false))));
    field.focus(); field.select && field.select();
  };
  draw();
  return view;
}

function renderGroupInfo(box, g) {

  const owner = g.adminId === meId;
  const admin = (g.members || []).some(u => u.id === meId && u.role === 'ADMIN');
  const members = (g.members || []).slice().sort((a, b) => {
    const rank = r => (r === 'OWNER' ? 0 : r === 'ADMIN' ? 1 : 2);
    return rank(a.role) - rank(b.role) || userName(a).localeCompare(userName(b));
  });
  const refresh = async () => { await refreshInfo(); loadChats(true); };

  const photo = h('div', { class: 'g-photo' }, avatar(g.name, g.groupPhotoUrl, g.id, 'lg'));
  if (owner) {
    const file = h('input', { type: 'file', accept: 'image/*', class: 'hidden', onchange: async e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      const fd = new FormData(); fd.append('file', f);

  const hero = h('div', { class: 'g-hero' },
    photo,
    editable(g.name, owner, { cls: 'g-name', label: 'Edit group name', max: 80, required: true }, v => put('/name?name=', v)),

    h('div', { class: 'g-sub' }, (g.members || []).length + (members.length === 1 ? ' member' : ' members') + (g.createdAt ? ' · Created ' + (toDate(g.createdAt) ? toDate(g.createdAt).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '') : '')));

  const rows = members.map(u => {
    const you = u.id === meId;
    const row = h('div', { class: 'm-row' },

      u.role === 'OWNER' ? h('span', { class: 'tag' }, 'Owner') : u.role === 'ADMIN' ? h('span', { class: 'tag' }, 'Admin') : null);
    row.classList.add('hit');
    row.addEventListener('click', e => { if (!e.target.closest('button')) openProfile(u.id); });
    if (owner && !you) row.append(btn('icon-btn', 'Manage ' + userName(u), 'more', e => memberMenu(e.currentTarget, g, u, refresh)));

    owner || admin ? h('button', { class: 'g-add', type: 'button', onclick: () => openInvite(g) }, h('div', { class: 'av icon' }, ico('qr')), 'Invite with link or QR code') : null,

function memberMenu(anchor, g, u, refresh) {

  const items = [];
  if (u.role === 'ADMIN') items.push(popItem('users', 'Remove as admin', () => run(() => api(base + '/admins/' + q(u.id), { method: 'DELETE' }), 'Admin removed')));
  else items.push(popItem('users', 'Make admin', () => run(() => api(base + '/admins?userId=' + q(u.id), { method: 'POST' }), 'Made admin')));
  items.push(popItem('check', 'Make owner', () => {

function afterLeave(c) {

async function leaveGroup(c) {
  if (!c) return;
  const url = '/api/groups/' + encodeURIComponent(c.groupId) + '/leave';
  let g = null;
  try { g = await api('/api/groups/' + encodeURIComponent(c.groupId)); } catch (e) { /* the server still decides below */ }
  const meId = S.me && S.me.id;
  const others = g ? (g.members || []).filter(u => u.id !== meId) : [];
  if (g && g.adminId === meId && others.length) { chooseNewOwner(c, g, others, url); return; }
  if (!confirm('Leave "' + chatTitle(c) + '"? You will stop receiving its messages.')) return;
  try { await api(url, { method: 'POST' }); afterLeave(c); } catch (e) { toast(e.message, true); }
}

// The owner cannot leave a group that still has people in it without handing it to one of them.
function chooseNewOwner(c, g, others, url) {
  let picked = null;
  const rank = u => (u.role === 'ADMIN' ? 0 : 1);
  const sorted = others.slice().sort((a, b) => rank(a) - rank(b) || userName(a).localeCompare(userName(b)));
  const go = h('button', { class: 'btn danger', type: 'button', disabled: true }, ico('logout'), 'Make owner and leave');
  const rows = sorted.map(u => {
    const row = h('button', { class: 'person', type: 'button', role: 'radio', 'aria-checked': 'false' },
      avatar(userName(u), u.profilePictureUrl, u.id, 'sm'),
      h('div', null, h('div', { class: 'n' }, userName(u)), h('div', { class: 'e' }, u.role === 'ADMIN' ? 'Admin' : (u.email || u.username || ''))),
      h('span', { class: 'tick-box' }, ico('check')));
    row.onclick = () => {
      picked = u;
      rows.forEach(r => { const on = r === row; r.classList.toggle('sel', on); r.setAttribute('aria-checked', on ? 'true' : 'false'); });
      go.disabled = false;
      go.lastChild.textContent = 'Make ' + userName(u) + ' owner and leave';
    };
    return row;
  });
  go.onclick = async () => {
    if (!picked) return;
    go.disabled = true;
    try { await api(url + '?newOwnerId=' + encodeURIComponent(picked.id), { method: 'POST' }); afterLeave(c); }
    catch (e) { go.disabled = false; toast(e.message, true); }
  };
  const back = h('button', { class: 'btn ghost', type: 'button', onclick: () => openGroupInfo(c) }, 'Back');
  openModal('Choose a new owner', [
    h('p', { class: 'hint' }, 'You own "' + chatTitle(c) + '". Pick who takes over before you leave. They become the owner and you are removed from the group.'),
    h('div', { class: 'people', role: 'radiogroup', 'aria-label': 'New owner' }, rows)], [back, go], true);
}

// Pushed by the server when a group changes (added, removed, renamed, roles).
async function onGroupEvent(d) {
  delete memberCache[d.chatId];
  const before = S.chats.length;
  if (d.event === 'REMOVED') {
    const wasActive = S.active && S.active === d.chatId;

function onStatusEvent(d) {
  if (!d) return;
  if (d.event === 'NEW_STATUS' || d.event === 'STATUS_DELETED') { refreshStatusFeed(); return; }
  if (d.event === 'ACTIVITY') {
    const s = [...S.status.mine, ...S.status.past.items].find(x => x.id === d.statusId);
    if (!s) return;
    s.stats = { views: d.views, likes: d.likes, reactions: d.reactions, comments: d.comments };
    renderStatusPanel();
    if (SV && SV.refreshStats) SV.refreshStats();

// ====================================================================
// Group invites: link, QR code, scanner, join
// ====================================================================
// A link looks like https://host/join/<code>. People can also paste just the code,
// or open this page as index.html#join=<code>.
const CODE_RE = '[A-Za-z0-9_-]{8,64}';
function inviteCodeFromUrl(text) {
  const m = String(text || '').trim().match(new RegExp('/join/(' + CODE_RE + ')(?:[/?#]|$)'));
  return m ? m[1] : null;
}
function inviteCodeFrom(text) {
  const t = String(text || '').trim();
  const fromUrl = inviteCodeFromUrl(t);
  if (fromUrl) return fromUrl;
  let m = t.match(new RegExp('[?&#]join=(' + CODE_RE + ')'));
  if (m) return m[1];
  m = t.match(new RegExp('^(' + CODE_RE + ')$'));
  return m ? m[1] : null;
}
// Opened as index.html#join=<code> (or ?join=<code>): remember it until the person is signed in.
function takePendingJoin() {
  const code = inviteCodeFrom(location.hash.replace(/^#\/?/, '#') + location.search);
  if (code && /[?&#]join=|\/join\//.test(location.hash + location.search)) {
    try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ }
    return code;
  }
  return null;
}
function runPendingJoin() {
  if (!S.pendingJoin) return;
  const code = S.pendingJoin; S.pendingJoin = null;
  openJoinPreview(code);
}

// ---------- drawing a QR code ----------
function qrCanvas(text, px) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), quiet = 4;
  const cell = Math.max(2, Math.floor((px || 240) / (n + quiet * 2)));
  const size = cell * (n + quiet * 2);
  const c = h('canvas', { width: size, height: size, class: 'qr', role: 'img', 'aria-label': 'QR code for the invite link' });
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) g.fillRect((q + quiet) * cell, (r + quiet) * cell, cell, cell);
  return c;
}
function downloadCanvas(canvas, name) {
  canvas.toBlob(b => {
    if (!b) return;
    const a = h('a', { href: URL.createObjectURL(b), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}
