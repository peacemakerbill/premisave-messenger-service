<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premisave Messenger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
:root {
  --accent: #00a884;
  --accent-strong: #008069;
  --accent-ink: #ffffff;
  --rail: #0f2f2b;
  --rail-ink: rgba(255,255,255,.72);
  --app-bg: #d1d7db;
  --panel: #ffffff;
  --panel-2: #f0f2f5;
  --row-hover: #f5f6f6;
  --row-active: #e4f3ec;
  --chat-bg: #efeae2;
  --bubble-in: #ffffff;
  --bubble-out: #d9fdd3;
  --text: #111b21;
  --text-2: #667781;
  --line: #e9edef;
  --tick: #53bdeb;
  --danger: #d93a4a;
  --warn-bg: #fff3c4;
  --warn-ink: #6b5200;
  --input-bg: #ffffff;
  --shadow: 0 1px 2px rgba(11,20,26,.14);
  --pop-shadow: 0 8px 28px rgba(11,20,26,.22);
  --doodle: rgba(11,20,26,.055);
  --reply-in: #f0f2f5;
  --reply-out: #cff0c8;
}
[data-theme="dark"] {
  --accent: #00a884;
  --accent-strong: #06cf9c;
  --rail: #0a1317;
  --rail-ink: rgba(233,237,239,.66);
  --app-bg: #0b141a;
  --panel: #111b21;
  --panel-2: #202c33;
  --row-hover: #1a252c;
  --row-active: #2a3942;
  --chat-bg: #0b141a;
  --bubble-in: #202c33;
  --bubble-out: #005c4b;
  --text: #e9edef;
  --text-2: #8696a0;
  --line: #222d34;
  --tick: #53bdeb;
  --warn-bg: #3a3112;
  --warn-ink: #f1d77a;
  --input-bg: #2a3942;
  --shadow: 0 1px 2px rgba(0,0,0,.45);
  --pop-shadow: 0 8px 28px rgba(0,0,0,.55);
  --doodle: rgba(233,237,239,.045);
  --reply-in: #1a252c;
  --reply-out: #025144;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14.5px/1.38 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  background: var(--app-bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { display: inline-flex; width: 24px; height: 24px; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico svg .f { fill: currentColor; stroke: none; }
.hidden { display: none !important; }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-2) 40%, transparent) transparent; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 68px clamp(310px, 30vw, 440px) 1fr; height: 100vh; height: 100dvh; max-width: 1680px; margin: 0 auto; background: var(--panel); position: relative; }
@media (min-width: 1700px) { body { padding: 18px 0; } .app { height: calc(100vh - 36px); box-shadow: var(--pop-shadow); border-radius: 10px; overflow: hidden; } }

.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; }
.brand { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; margin-bottom: 14px; }
.brand .ico { width: 24px; height: 24px; }
.rail-btn { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: var(--rail-ink); position: relative; transition: background .15s, color .15s; }
.rail-btn:hover { background: rgba(255,255,255,.09); color: #fff; }
.rail-btn.active { background: rgba(255,255,255,.13); color: #fff; }
.rail-btn.active::before { content: ""; position: absolute; left: -11px; top: 11px; bottom: 11px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
.rail-btn .badge { position: absolute; top: 5px; right: 4px; }
.rail .grow { flex: 1; }

/* ---------- list panel ---------- */
.list { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--panel); }
.list-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px 20px; }
.list-head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); transition: background .15s; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn .ico { width: 22px; height: 22px; }
.search { margin: 6px 14px 10px; position: relative; }
.search input { width: 100%; height: 38px; border: 0; border-radius: 10px; background: var(--panel-2); padding: 0 12px 0 40px; outline-offset: 0; }
.search input::placeholder { color: var(--text-2); }
.search .ico { position: absolute; left: 12px; top: 9px; width: 20px; height: 20px; color: var(--text-2); pointer-events: none; }
.conn { margin: 0 14px 8px; padding: 7px 12px; border-radius: 8px; font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); display: flex; align-items: center; gap: 8px; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.rows { flex: 1; min-height: 0; }
.row { display: flex; gap: 14px; align-items: center; padding: 0 16px 0 16px; width: 100%; text-align: left; height: 72px; position: relative; }
.row:hover { background: var(--row-hover); }
.row.active { background: var(--row-active); }
.row .body { flex: 1; min-width: 0; border-bottom: 1px solid var(--line); height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.row:last-child .body { border-bottom-color: transparent; }
.row .top, .row .bottom { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .name { flex: 1; font-size: 16.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .time { font-size: 12px; color: var(--text-2); flex: none; }
.row.unread .time { color: var(--accent-strong); font-weight: 600; }
.row .preview { flex: 1; min-width: 0; color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.row .preview .ico { width: 16px; height: 16px; }
.row .preview .txt { overflow: hidden; text-overflow: ellipsis; }
.row .preview .who { color: var(--text); opacity: .8; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; }
.empty { padding: 44px 28px; text-align: center; color: var(--text-2); }
.empty h3 { margin: 12px 0 6px; font-size: 16px; color: var(--text); font-weight: 600; }
.empty p { margin: 0 0 16px; }

/* ---------- avatar ---------- */
.av { width: 49px; height: 49px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 18px; position: relative; background-size: cover; background-position: center; user-select: none; }
.av.sm { width: 36px; height: 36px; font-size: 14px; }
.av.xs { width: 28px; height: 28px; font-size: 11px; }
.av.lg { width: 96px; height: 96px; font-size: 36px; }
.av .dot { position: absolute; right: 0; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: #25d366; border: 2.5px solid var(--panel); }
.av.grp::after { content: none; }

/* ---------- chat panel ---------- */
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat-bg); position: relative; }
.chat-head { height: 60px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); z-index: 3; }
.chat-head .who { flex: 1; min-width: 0; text-align: left; }
.chat-head .who .n { font-size: 16.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head .who .s { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
.chat-head .who .s.live { color: var(--accent-strong); }
.back { display: none; }
.search-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
.search-bar input { flex: 1; height: 36px; border: 0; border-radius: 10px; background: var(--panel-2); padding: 0 12px; outline-offset: 0; }
.search-bar .count { font-size: 12.5px; color: var(--text-2); min-width: 54px; text-align: right; }

.wall { position: absolute; inset: 0; background-image: var(--wall); background-size: 220px 220px; pointer-events: none; z-index: 0; }
.thread { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 14px clamp(12px, 6vw, 72px) 10px; display: flex; flex-direction: column; }
.thread .spacer { flex: 1; }
.day { align-self: center; margin: 12px 0 8px; padding: 5px 12px; border-radius: 8px; background: var(--panel); color: var(--text-2); font-size: 12.5px; box-shadow: var(--shadow); }
[data-theme="dark"] .day { background: #182229; }
.sys { align-self: center; margin: 6px 0; padding: 6px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12.5px; text-align: center; max-width: 80%; }
.older { align-self: center; margin: 4px 0 8px; padding: 6px 14px; border-radius: 16px; background: var(--panel); color: var(--accent-strong); font-size: 13px; box-shadow: var(--shadow); }

.msg { display: flex; margin-top: 2px; position: relative; }
.msg.out { justify-content: flex-end; }
.msg.first { margin-top: 9px; }
.msg.hit .bubble { outline: 2px solid var(--accent); }
.msg.dim .bubble { opacity: .35; }
.bubble { position: relative; max-width: min(520px, 78%); background: var(--bubble-in); border-radius: 8px; padding: 6px 8px 7px 9px; box-shadow: var(--shadow); min-width: 64px; word-wrap: break-word; overflow-wrap: anywhere; }
.msg.out .bubble { background: var(--bubble-out); }
.msg.first.in .bubble { border-top-left-radius: 0; }
.msg.first.out .bubble { border-top-right-radius: 0; }
.msg.first.in .bubble::before, .msg.first.out .bubble::before { content: ""; position: absolute; top: 0; width: 9px; height: 12px; background: inherit; }
.msg.first.in .bubble::before { left: -8px; clip-path: polygon(100% 0, 0 0, 100% 100%); }
.msg.first.out .bubble::before { right: -8px; clip-path: polygon(0 0, 100% 0, 0 100%); }
.bubble .sender { font-size: 13px; font-weight: 600; margin-bottom: 1px; }
.bubble .text { white-space: pre-wrap; font-size: 14.5px; }
.bubble .text a { color: var(--accent-strong); text-decoration: none; }
.bubble .text a:hover { text-decoration: underline; }
.bubble .text mark { background: #ffd54f; color: #111; border-radius: 2px; }
.bubble .text.gone { color: var(--text-2); font-style: italic; display: flex; align-items: center; gap: 6px; }
.bubble .text.gone .ico { width: 16px; height: 16px; }
.meta { float: right; margin: 6px 0 -3px 12px; display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-2); line-height: 1; height: 15px; position: relative; top: 2px; }
.meta .tick { width: 17px; height: 17px; }
.meta .tick.read { color: var(--tick); }
.meta .tick.fail { color: var(--danger); }
.bubble.media-only .meta { position: absolute; right: 8px; bottom: 7px; margin: 0; padding: 3px 6px; border-radius: 10px; background: rgba(0,0,0,.45); color: #fff; float: none; top: auto; height: auto; }
.bubble.media-only .meta .tick.read { color: #7fd6ff; }
.chev { position: absolute; top: 3px; right: 4px; width: 24px; height: 22px; border-radius: 50%; display: none; place-items: center; color: var(--text-2); background: linear-gradient(90deg, transparent, var(--bubble-in) 40%); z-index: 2; }
.msg.out .chev { background: linear-gradient(90deg, transparent, var(--bubble-out) 40%); }
.chev .ico { width: 18px; height: 18px; }
.bubble:hover .chev { display: grid; }
.bubble.media-only .chev { color: #fff; background: rgba(0,0,0,.35); }

.quote { display: flex; margin: 0 0 4px; border-radius: 6px; overflow: hidden; background: var(--reply-in); cursor: pointer; }
.msg.out .quote { background: var(--reply-out); }
.quote::before { content: ""; width: 4px; background: var(--accent); flex: none; }
.quote .q { padding: 5px 9px; min-width: 0; }
.quote .qn { font-size: 12.8px; font-weight: 600; color: var(--accent-strong); }
.quote .qt { font-size: 13px; color: var(--text-2); display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote .qt .ico { width: 14px; height: 14px; }

.media { display: block; margin: -2px -3px 4px; border-radius: 6px; overflow: hidden; position: relative; cursor: zoom-in; background: rgba(0,0,0,.08); }
.media img, .media video { display: block; max-width: 100%; width: auto; height: auto; max-height: 340px; min-width: 180px; }
.media video { cursor: default; background: #000; }
.media.uploading::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.ring { position: absolute; z-index: 2; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: rgba(255,255,255,.28); }
.ring .fg { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .15s; }

.file { display: flex; align-items: center; gap: 11px; padding: 9px 10px; margin: -1px -2px 4px; border-radius: 7px; background: var(--reply-in); min-width: 230px; text-decoration: none; color: inherit; position: relative; }
.msg.out .file { background: var(--reply-out); }
.file .fi { width: 40px; height: 46px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; letter-spacing: .02em; }
.file .fi.pdf { background: #e5493a; } .file .fi.doc { background: #2b6cd4; } .file .fi.xls { background: #1f9d55; } .file .fi.ppt { background: #e07a1f; } .file .fi.zip { background: #8a6fd1; }
.file .fn { min-width: 0; flex: 1; }
.file .fn b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.file .fn span { font-size: 12px; color: var(--text-2); }
.file .dl { color: var(--text-2); }
.file:hover .dl { color: var(--accent-strong); }

.voice { display: flex; align-items: center; gap: 10px; min-width: 250px; padding: 2px 2px 4px; }
.voice .pp { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.voice .pp .ico { width: 18px; height: 18px; }
.voice .wave { flex: 1; height: 28px; display: flex; align-items: center; gap: 2px; cursor: pointer; }
.voice .wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--text-2); opacity: .45; }
.voice .wave i.on { background: var(--accent-strong); opacity: 1; }
.voice .dur { font-size: 12px; color: var(--text-2); min-width: 34px; }

.to-bottom { position: absolute; right: 22px; bottom: 82px; z-index: 4; width: 42px; height: 42px; border-radius: 50%; background: var(--panel); color: var(--text-2); box-shadow: var(--pop-shadow); display: grid; place-items: center; }
.to-bottom .badge { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }

/* ---------- composer ---------- */
.composer { position: relative; z-index: 3; flex: none; background: var(--panel-2); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 6px; }
.composer .field { flex: 1; background: var(--input-bg); border-radius: 22px; display: flex; align-items: flex-end; padding: 2px 4px; min-width: 0; }
.composer textarea { flex: 1; border: 0; background: transparent; resize: none; max-height: 140px; min-height: 40px; padding: 10px 6px; line-height: 20px; outline: none; min-width: 0; }
.composer textarea::placeholder { color: var(--text-2); }
.composer .icon-btn { flex: none; }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; transition: background .15s, transform .1s; }
.send:hover { background: var(--accent-strong); }
.send:active { transform: scale(.94); }
.reply-bar { position: relative; z-index: 3; background: var(--panel-2); padding: 8px 12px 0; display: flex; align-items: stretch; gap: 6px; }
.reply-bar .quote { flex: 1; margin: 0; background: var(--panel); cursor: default; }
.rec { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--input-bg); border-radius: 22px; height: 44px; padding: 0 10px; }
.rec .led { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: pulse 1s ease-in-out infinite; }
.rec .t { font-variant-numeric: tabular-nums; min-width: 42px; }
.hint { color: var(--text-2); font-size: 13px; margin: 0 0 8px; }
.rec .hint { color: var(--text-2); font-size: 13px; flex: 1; }

.pop { position: absolute; z-index: 60; background: var(--panel); border-radius: 12px; box-shadow: var(--pop-shadow); padding: 6px 0; min-width: 190px; }
.pop button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 18px; text-align: left; }
.pop button:hover { background: var(--panel-2); }
.pop button .ico { width: 20px; height: 20px; color: var(--text-2); }
.pop button.danger { color: var(--danger); } .pop button.danger .ico { color: var(--danger); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.attach-menu { bottom: 62px; left: 10px; padding: 8px; display: grid; gap: 2px; }
.attach-menu button { border-radius: 10px; }
.attach-menu .tint { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.attach-menu .tint .ico { color: #fff; width: 19px; height: 19px; }
.emoji-pop { bottom: 62px; left: 10px; width: min(340px, calc(100% - 20px)); padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 260px; overflow-y: auto; }
.emoji-pop button { padding: 4px 0; justify-content: center; font-size: 22px; border-radius: 8px; }

.placeholder { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; text-align: center; padding: 30px; background: var(--panel-2); }
.placeholder .card { max-width: 440px; }
.placeholder .mark { width: 96px; height: 96px; border-radius: 28px; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 22px; }
.placeholder .mark .ico { width: 50px; height: 50px; }
.placeholder h2 { margin: 0 0 8px; font-size: 28px; font-weight: 300; letter-spacing: -.01em; }
.placeholder p { margin: 0; color: var(--text-2); }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(11,20,26,.55); display: grid; place-items: center; padding: 16px; }
.modal { width: min(440px, 100%); max-height: min(640px, 92vh); background: var(--panel); border-radius: 14px; box-shadow: var(--pop-shadow); display: flex; flex-direction: column; overflow: hidden; }
.modal.wide { width: min(560px, 100%); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.modal-foot { padding: 12px 20px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); background: var(--panel-2); }
.btn { height: 40px; padding: 0 20px; border-radius: 20px; background: var(--accent); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; color: var(--accent-strong); }
.btn.ghost:hover { background: var(--panel-2); }
.btn:disabled { opacity: .55; cursor: default; }
.field-l { display: block; margin: 12px 0 5px; font-size: 13px; color: var(--text-2); }
.field-l:first-child { margin-top: 0; }
.fld { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--input-bg); padding: 0 12px; outline-offset: 0; }
.fld:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.note { font-size: 12.5px; color: var(--text-2); margin: 6px 0 0; }
.people { margin: 10px -20px -16px; }
.person { display: flex; align-items: center; gap: 12px; padding: 8px 20px; width: 100%; text-align: left; }
.person:hover { background: var(--row-hover); }
.person .n { font-weight: 500; } .person .e { font-size: 13px; color: var(--text-2); }
.preview-box { background: var(--panel-2); border-radius: 10px; min-height: 160px; display: grid; place-items: center; padding: 10px; margin-bottom: 14px; }
.preview-box img, .preview-box video { max-width: 100%; max-height: 300px; border-radius: 6px; }
.queue { display: grid; gap: 6px; margin-bottom: 12px; }
.queue .q { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--panel-2); border-radius: 8px; font-size: 13.5px; }
.queue .q span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue .q small { color: var(--text-2); }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(5,10,13,.94); display: flex; flex-direction: column; }

  const paint = () => {
    const d = audio && isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
    const frac = d ? audio.currentTime / d : 0;
    [...wave.children].forEach((b, i) => b.classList.toggle('on', i / bars < frac));
    dur.textContent = fmtDur(audio ? (audio.paused && !audio.currentTime && d ? d : audio.currentTime) : 0);
  };
  const ensure = () => {
    if (audio) return audio;
    audio = new Audio(m._local || m.mediaUrl);
    audio.preload = 'metadata';
    audio.addEventListener('timeupdate', paint);
    audio.addEventListener('loadedmetadata', paint);
    audio.addEventListener('ended', () => { pp.replaceChildren(ico('play')); audio.currentTime = 0; paint(); });
    return audio;
  };
  pp.onclick = () => {
    const a = ensure();
    if (a.paused) {
      if (playing && playing !== a) playing.pause();
      playing = a;
      a.play().catch(() => toast('This audio could not be played.', true));
      pp.replaceChildren(ico('pause'));
    } else { a.pause(); pp.replaceChildren(ico('play')); }
  };
  wave.onclick = e => {
    const a = ensure();
    const rect = wave.getBoundingClientRect();
    const go = () => { if (isFinite(a.duration)) { a.currentTime = a.duration * ((e.clientX - rect.left) / rect.width); paint(); } };
    if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, { once: true });
  };
  return h('div', { class: 'voice' }, pp, wave, dur);
}

function buildMeta(m, overMedia) {
  const mine = S.me && m.senderId === S.me.id;
  const d = toDate(m.createdAt) || new Date();
  const meta = h('div', { class: 'meta' }, h('span', null, fmtTime(d)));
  if (m.editedAt && !m.deleted) meta.prepend(h('span', null, 'edited'));
  if (mine && !m.deleted) {
    const st = tickState(m);
    const t = tickIcon(st);
    if (st === 'fail') { t.style.cursor = 'pointer'; t.title = 'Failed to send. Click to retry.'; t.onclick = () => retrySend(m); }
    meta.append(t);
  }
  return meta;
}

function buildMsg(m, prev) {
  const mine = S.me && m.senderId === S.me.id;
  const c = chatById(m.chatId) || chatById(S.active);
  const d = toDate(m.createdAt) || new Date();
  const pd = prev && toDate(prev.createdAt);
  const first = !prev || prev.senderId !== m.senderId || !pd || !sameDay(pd, d);
  const kind = m.deleted ? 'text' : kindOf(m);
  if (!m.replyPreview && m.replyToMessageId) {
    const src = ((S.msgs[m.chatId] || {}).list || []).find(x => x.id === m.replyToMessageId);
    if (src) m.replyPreview = { messageId: src.id, senderId: src.senderId, senderName: src.senderName, content: src.content, messageType: src.messageType, mimeType: src.mimeType, fileName: src.fileName, mediaUrl: src.mediaUrl, attachmentId: src.attachmentId };
  }
  const mediaOnly = (kind === 'image' || kind === 'video') && !m.content && !m.replyPreview;
  const bubble = h('div', { class: 'bubble' + (mediaOnly ? ' media-only' : '') });

  if (c && c.chatType === 'GROUP' && !mine && first) {
    bubble.append(h('div', { class: 'sender hit', style: 'color:' + colorFor(m.senderId), onclick: () => openProfile(m.senderId) }, m.senderName || 'Member'));
  }
  if (m.replyPreview && !m.deleted) {
    const rp = m.replyPreview;
    const pv = previewOf({ ...rp, content: rp.content });
    bubble.append(h('div', { class: 'quote', onclick: () => jumpTo(rp.messageId) },
      h('div', { class: 'q' },
        h('div', { class: 'qn' }, rp.senderId && S.me && rp.senderId === S.me.id ? 'You' : (rp.senderName || 'Message')),
        h('div', { class: 'qt' }, pv.icon ? ico(pv.icon) : null, pv.text || 'Message'))));
  }

  if (m.deleted) {
    bubble.append(h('div', { class: 'text gone' }, ico('ban'), 'This message was deleted'));
  } else {
    const src = m._local || m.mediaUrl;
    if (kind === 'image') {
      const img = h('img', { src, alt: m.fileName || 'Photo', loading: 'lazy' });
      const wrap = h('div', { class: 'media' + (m._pending ? ' uploading' : ''), onclick: () => !m._pending && openLightbox(src, m.fileName) }, img);
      if (m._pending) { m._ring = progressRing(m._progress); wrap.append(m._ring); }
      bubble.append(wrap);
    } else if (kind === 'video') {
      const v = h('video', { src, controls: !m._pending, preload: 'metadata', playsinline: true });
      const wrap = h('div', { class: 'media' + (m._pending ? ' uploading' : ''), style: 'cursor:default' }, v);
      if (m._pending) { m._ring = progressRing(m._progress); wrap.append(m._ring); }
      bubble.append(wrap);
    } else if (kind === 'audio') {
      bubble.append(voicePlayer(m));
    } else if (kind === 'file') {
      const sub = m._pending ? 'Uploading ' + Math.round((m._progress || 0) * 100) + '%' : [fmtSize(m.fileSize), ((m.fileName || '').split('.').pop() || '').toUpperCase()].filter(Boolean).join('  ');
      const card = h('a', { class: 'file', href: m._pending ? null : src, target: '_blank', rel: 'noopener', download: m.fileName || true },
        fileBadge(m.fileName, m.mimeType),
        h('div', { class: 'fn' }, h('b', null, m.fileName || 'File'), h('span', { class: 'sub' }, sub)),
        m._pending ? null : h('span', { class: 'dl' }, ico('download')));
      if (m._pending) card.addEventListener('click', e => e.preventDefault());
      m._sub = $('.sub', card);
      bubble.append(card);
    }
    if (m.content) {
      const t = h('div', { class: 'text' });
      t.append(richText(m.content, S.search.open ? S.search.q : ''));
      bubble.append(t);
    }
  }
  bubble.append(buildMeta(m));
  if (!m._pending) {
    bubble.append(h('button', { class: 'chev', type: 'button', 'aria-label': 'Message options', onclick: e => { e.stopPropagation(); openMsgMenu(e.currentTarget, m); } }, ico('chevron')));
  }

  const el = h('div', { class: 'msg ' + (mine ? 'out' : 'in') + (first ? ' first' : ''), 'data-id': m.id || m._tmpId }, bubble);
  el._m = m;
  return el;
}

// ====================================================================
// Thread
// ====================================================================
function bucket(chatId) {
  return S.msgs[chatId] || (S.msgs[chatId] = { list: [], ids: new Set(), page: 0, more: true, loading: false });
}
function prevOf(b, m) { const i = b.list.indexOf(m); return i > 0 ? b.list[i - 1] : null; }

function renderThread() {
  const c = chatById(S.active);
  if (!c) { R.thread.replaceChildren(); return; }
  const b = bucket(c.id);
  const nodes = [h('div', { class: 'spacer' })];
  if (b.more && b.list.length) nodes.push(h('button', { class: 'older', type: 'button', onclick: loadOlder }, 'Load older messages'));
  let prev = null;
  for (const m of b.list) {
    const d = toDate(m.createdAt) || new Date();
    const pd = prev && toDate(prev.createdAt);
    if (!pd || !sameDay(pd, d)) nodes.push(h('div', { class: 'day' }, dayLabel(d)));
    nodes.push(buildMsg(m, prev));
    prev = m;
  }
  if (!b.list.length && !b.loading) nodes.push(h('div', { class: 'sys' }, 'No messages yet. Say hello.'));
  R.thread.replaceChildren(...nodes);
  applySearchMarks();
}
function scrollBottom(smooth) {
  R.thread.scrollTo({ top: R.thread.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  S.newBelow = 0; syncToBottom();
}
function onThreadScroll() {
  const t = R.thread;
  S.nearBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 120;
  if (S.nearBottom) S.newBelow = 0;
  syncToBottom();
}
function syncToBottom() {
  R.toBottom.classList.toggle('hidden', S.nearBottom);
  R.toBottom.querySelector('.badge')?.remove();
  if (S.newBelow) R.toBottom.append(h('span', { class: 'badge' }, S.newBelow));
}
function jumpTo(id) {
  const el = R.thread.querySelector('[data-id="' + CSS.escape(id) + '"]');
  if (!el) { toast('That message is further up. Load older messages first.'); return; }
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 1400);
}

function insertMessage(m) {
  // adds a message to the open thread without a full re-render
  const b = bucket(m.chatId);
  const prev = b.list[b.list.length - 2] || null; // m is already last
  const d = toDate(m.createdAt) || new Date();
  const pd = prev && toDate(prev.createdAt);
  R.thread.querySelector('.sys')?.remove();
  if (!pd || !sameDay(pd, d)) R.thread.append(h('div', { class: 'day' }, dayLabel(d)));
  R.thread.append(buildMsg(m, prev));
}
function msgEl(m) { return R.thread.querySelector('[data-id="' + CSS.escape(m.id || m._tmpId) + '"]'); }
function refreshMeta(m) {
  const el = msgEl(m); if (!el) return;
  const old = $('.meta', el); if (old) old.replaceWith(buildMeta(m));
}
function rebuildMsg(m) {
  const el = msgEl(m); if (!el) return;
  const b = bucket(m.chatId);
  el.replaceWith(buildMsg(m, prevOf(b, m)));
}

function mergeEvents(m) {
  if (m.id && S.deliveredIds.has(m.id)) m._delivered = true;
  const rr = m.id && S.readReceipts.get(m.id);
  if (rr) { m.readBy = [...new Set([...(m.readBy || []), ...rr])]; }
}

async function loadMessages(chatId, reset) {
  const b = bucket(chatId);
  if (b.loading) return;
  b.loading = true;
  try {
    const page = reset ? 0 : b.page + 1;
    const rows = await api('/api/messages/chat/' + encodeURIComponent(chatId) + '?page=' + page + '&size=40');
    const batch = (rows || []).slice().reverse();
    b.more = (rows || []).length >= 40;
    b.page = page;
    if (reset) {
      const pendings = b.list.filter(x => x._pending || x._failed);
      b.list = []; b.ids = new Set();
      for (const m of batch) { mergeEvents(m); b.list.push(m); b.ids.add(m.id); }
      b.list.push(...pendings);
    } else {
      const fresh = batch.filter(m => !b.ids.has(m.id));
      fresh.forEach(m => { mergeEvents(m); b.ids.add(m.id); });
      b.list.unshift(...fresh);
    }
  } finally { b.loading = false; }
}
async function loadOlder() {
  const c = chatById(S.active); if (!c) return;
  const t = R.thread, before = t.scrollHeight - t.scrollTop;
  try { await loadMessages(c.id, false); } catch (e) { toast(e.message, true); return; }
  renderThread();
  t.scrollTop = t.scrollHeight - before;
}

async function loadChats(silent) {
  try {
    const rows = await api('/api/chats');
    S.chats = rows || [];
    if (!S.me && S.chats[0] && S.chats[0].currentUser) S.me = S.chats[0].currentUser;
    S.chats.forEach(c => { const p = presenceOf(c); const id = otherId(c); if (id && !S.presence[id]) S.presence[id] = { online: p.online, lastSeen: p.lastSeen }; });
    renderList();
    if (S.active) renderHeader();
  } catch (e) { if (!silent) toast(e.message, true); }
}

async function openChat(id) {
  if (S.active) S.drafts[S.active] = R.ta.value;
  S.active = id;
  S.unread[id] = 0;
  clearReply();
  closeSearch();
  R.app.classList.add('has-chat');
  renderHeader(); renderList();
  R.ta.value = S.drafts[id] || '';
  autoGrow(); syncSendButton();
  const b = bucket(id);
  if (!b.list.length || !b.loadedOnce) {
    R.thread.replaceChildren(h('div', { class: 'spacer' }), h('div', { class: 'sys' }, 'Loading messages'));
    try { await loadMessages(id, true); b.loadedOnce = true; }
    catch (e) { R.thread.replaceChildren(h('div', { class: 'spacer' }), h('div', { class: 'sys' }, e.message)); return; }
  }
  if (S.active !== id) return;
  renderThread();
  S.nearBottom = true; scrollBottom();
  markChatRead(id);
  if (matchMedia('(min-width: 861px)').matches) R.ta.focus();
}
function closeChat() {
  if (S.active) S.drafts[S.active] = R.ta.value;
  S.active = null;
  R.app.classList.remove('has-chat');
  renderHeader(); renderList();
}
function markAllRead(chatId) {
  const b = bucket(chatId);
  let n = 0;
  for (const m of b.list) {
    if (n >= 60) break;
    if (m.id && S.me && m.senderId !== S.me.id && !(m.readBy || []).includes(S.me.id) && !m.deleted) { markRead(m); n++; }
  }
}
function markRead(m) {
  m.readBy = [...(m.readBy || []), S.me.id];
  if (S.ws && S.wsState === 'open') {
    try { S.ws.send('/app/chat.read', {}, JSON.stringify({ id: m.id, chatId: m.chatId })); return; } catch (e) { /* fall back to REST */ }
  }
  api('/api/messages/read/' + encodeURIComponent(m.id), { method: 'POST' }).catch(() => { /* retried when the chat is opened again */ });
}

// ---------- adding messages ----------
function noteChatActivity(m) {
  let c = chatById(m.chatId);
  if (!c) { loadChats(true); return; }
  c.lastMessage = m;
  c.lastMessageAt = m.createdAt || new Date().toISOString();
}
function addIncoming(m) {
  const b = bucket(m.chatId);
  const existing = b.list.find(x => x.id === m.id);
  if (existing) {
    // updates to a known message, such as delete for everyone
    Object.assign(existing, m, { _delivered: existing._delivered });
    if (m.chatId === S.active) rebuildMsg(existing);
    const c = chatById(m.chatId); if (c && c.lastMessage && c.lastMessage.id === m.id) c.lastMessage = existing;
    renderList();
    return;
  }
  mergeEvents(m);
  b.list.push(m); b.ids.add(m.id);
  noteChatActivity(m);
  const mine = S.me && m.senderId === S.me.id;
  if (m.chatId === S.active) {
    insertMessage(m);
    if (!mine) {
      if (document.visibilityState === 'visible') markRead(m);
      if (S.nearBottom) scrollBottom(true); else { S.newBelow++; syncToBottom(); }
    } else scrollBottom(true);
  } else if (!mine) {
    S.unread[m.chatId] = (S.unread[m.chatId] || 0) + 1;
  }
  const c = chatById(m.chatId);
  if (c && S.typing[c.id] && !mine) { clearTimeout(S.typing[c.id]); delete S.typing[c.id]; if (m.chatId === S.active) renderHeader(); }
  renderList();
}

// ====================================================================
// Sending
// ====================================================================
function pendingMsg(chatId, fields) {
  const reply = S.replyTo && S.replyTo.chatId === chatId ? S.replyTo : null;
  return Object.assign({
    _tmpId: 'tmp-' + (++S.tmp), _pending: true, chatId,
    senderId: S.me.id, senderName: userName(S.me), status: 'SENDING', readBy: [],
    createdAt: new Date().toISOString(), messageType: 'TEXT',
    replyToMessageId: reply ? reply.id : null,
    replyPreview: reply ? { messageId: reply.id, senderId: reply.senderId, senderName: reply.senderId === S.me.id ? 'You' : reply.senderName, content: reply.content, messageType: reply.messageType, mimeType: reply.mimeType, fileName: reply.fileName, mediaUrl: reply.mediaUrl, attachmentId: reply.attachmentId } : null
  }, fields);
}
function pushPending(m) {
  const b = bucket(m.chatId);
  b.list.push(m);
  noteChatActivity(m);
  if (m.chatId === S.active) { insertMessage(m); scrollBottom(true); }
  renderList();
}
function settle(temp, real) {
  const b = bucket(temp.chatId);
  const i = b.list.indexOf(temp);
  mergeEvents(real);
  if (b.ids.has(real.id)) {                // the live echo got there first
    if (i >= 0) b.list.splice(i, 1);
    msgEl(temp)?.remove();
  } else {
    if (i >= 0) b.list[i] = real; else b.list.push(real);
    b.ids.add(real.id);
    const el = msgEl(temp);
    if (el) el.replaceWith(buildMsg(real, prevOf(b, real)));
  }
  if (temp._local) setTimeout(() => URL.revokeObjectURL(temp._local), 4000);
  noteChatActivity(real);
  renderList();
}
function failed(temp, err) {
  temp._pending = false; temp._failed = true;
  toast(err.message || 'Message not sent', true);
  const el = msgEl(temp);
  if (el) el.replaceWith(buildMsg(temp, prevOf(bucket(temp.chatId), temp)));
  renderList();
}
async function sendPayload(temp, payload) {
  try {
    const real = await api('/api/messages', { method: 'POST', json: payload });
    settle(temp, real);
  } catch (e) { temp._payload = payload; failed(temp, e); }
}
function retrySend(m) {
  if (!m._payload) { toast('Nothing to retry. Send it again.'); return; }
  m._failed = false; m._pending = true;
  const el = msgEl(m); if (el) el.replaceWith(buildMsg(m, prevOf(bucket(m.chatId), m)));
  sendPayload(m, m._payload);
}

function sendText() {
  const c = chatById(S.active); if (!c) return;
  const text = R.ta.value.trim();
  if (!text) return;
  R.ta.value = ''; S.drafts[c.id] = ''; autoGrow(); syncSendButton();
  const temp = pendingMsg(c.id, { content: text });
  const payload = { chatId: c.id, content: text, replyToMessageId: temp.replyToMessageId || undefined };
  clearReply();
  pushPending(temp);
  sendPayload(temp, payload);
}

async function sendFileMessage(file, caption, chatId) {
  const mime = (file.type || '').toLowerCase();
  const type = mime.startsWith('image/') ? 'IMAGE' : mime.startsWith('video/') ? 'VIDEO' : mime.startsWith('audio/') ? 'VOICE' : 'DOCUMENT';
  const temp = pendingMsg(chatId, { content: caption || '', messageType: type, fileName: file.name, fileSize: file.size, _mime: mime || 'application/octet-stream', _local: URL.createObjectURL(file), _progress: 0 });
  const reply = temp.replyToMessageId;
  clearReply();
  pushPending(temp);
  try {
    const up = await uploadFile(file, chatId, p => {
      temp._progress = p;
      if (temp._ring) temp._ring._set(p);
      if (temp._sub) temp._sub.textContent = 'Uploading ' + Math.round(p * 100) + '%';
    });
    await sendPayload(temp, { chatId, content: caption || '', attachmentId: up.attachmentId, replyToMessageId: reply || undefined });
  } catch (e) {
    temp._payload = null; failed(temp, e);
  }
}
async function sendFiles(files, caption) {
  const c = chatById(S.active); if (!c) return;
  let first = true;
  for (const f of files) { await sendFileMessage(f, first ? caption : '', c.id); first = false; }
}

// ---------- reply ----------
function setReply(m) {
  S.replyTo = m;
  const pv = previewOf(m);
  R.replyBar.replaceChildren(
    h('div', { class: 'quote' }, h('div', { class: 'q' },
      h('div', { class: 'qn' }, m.senderId === S.me.id ? 'You' : (m.senderName || 'Message')),
      h('div', { class: 'qt' }, pv.icon ? ico(pv.icon) : null, pv.text))),
    btn('icon-btn', 'Cancel reply', 'x', clearReply));
  R.replyBar.classList.remove('hidden');
  R.ta.focus();
}
function clearReply() { S.replyTo = null; if (R.replyBar) { R.replyBar.classList.add('hidden'); R.replyBar.replaceChildren(); } }

// ====================================================================
// Composer
// ====================================================================
const EMOJI = ['😀','😃','😄','😁','😆','😅','😂','🤣','🙂','😉','😊','😇','🥰','😍','🤩','😘','😋','😜','🤪','😎','🤓','🥳','😏','😒','😔','😢','😭','😤','😡','🤯','😱','🥶','🤔','🤗','🙄','😴','👍','👎','👏','🙌','🙏','💪','👋','🤝','✌️','👌','🔥','✨','🎉','💯','❤️','🧡','💛','💚','💙','💜','🖤','💔','👀','✅','❌','⭐','🏠','📎','📷','🎵'];

function buildComposer() {

  R.sendBtn = h('button', { class: 'send', type: 'button', 'aria-label': 'Send', onclick: onSendOrMic }, ico('mic'));

  R.fileMedia = h('input', { type: 'file', multiple: true, accept: 'image/*,video/*', class: 'hidden', onchange: e => pickFiles(e) });

}
function autoGrow() { R.ta.style.height = 'auto'; R.ta.style.height = Math.min(R.ta.scrollHeight, 140) + 'px'; }
function syncSendButton() {
  const has = R.ta.value.trim().length > 0;
  R.sendBtn.replaceChildren(ico(has ? 'send' : 'mic'));
  R.sendBtn.setAttribute('aria-label', has ? 'Send' : 'Record voice message');
  R.sendBtn.title = has ? 'Send' : 'Record voice message';
}
let typingSentAt = 0;
function onType() {
  autoGrow(); syncSendButton();
  const c = chatById(S.active);
  if (!c || c.chatType === 'GROUP' || !R.ta.value.trim()) return;
  const now = Date.now();
  if (now - typingSentAt > 2500 && S.ws && S.wsState === 'open') {
    typingSentAt = now;
    try { S.ws.send('/app/chat.typing', {}, JSON.stringify({ chatId: c.id, receiverId: otherId(c) })); } catch (e) { /* ignore */ }
  }
}
function onComposerKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); }
}
function onSendOrMic() {
  if (R.ta.value.trim()) sendText(); else startRecording();
}
function onPaste(e) {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])];
  if (files.length) { e.preventDefault(); openSendDialog(files); }
}
function pickFiles(e) {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length) openSendDialog(files);
}

// ---------- popovers ----------
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; } }
document.addEventListener('mousedown', e => { if (openPop && !openPop.contains(e.target) && !e.target.closest('[data-pop-anchor]')) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); closeModal(); closeLightbox(); } });
function showPop(pop, anchor) { closePop(); anchor.setAttribute('data-pop-anchor', ''); openPop = pop; return pop; }

function toggleSearch() { S.search.open ? closeSearch() : openSearch(); }
function openSearch() {
  S.search = { open: true, q: '', hits: [], at: -1 };
  const input = h('input', { type: 'search', placeholder: 'Search in this chat', 'aria-label': 'Search in this chat',
    oninput: e => { S.search.q = e.target.value.trim(); applySearchMarks(true); },
    onkeydown: e => { if (e.key === 'Enter') stepSearch(e.shiftKey ? -1 : 1); } });
  R.searchCount = h('span', { class: 'count' });
  R.searchBar.replaceChildren(input, R.searchCount, btn('icon-btn', 'Previous match', 'up', () => stepSearch(-1)), btn('icon-btn', 'Next match', 'down', () => stepSearch(1)), btn('icon-btn', 'Close search', 'x', closeSearch));
  R.searchBar.classList.remove('hidden');

function closeSearch() {
  S.search = { open: false, q: '', hits: [], at: -1 };
  if (R.searchBar) { R.searchBar.classList.add('hidden'); R.searchBar.replaceChildren(); }
  if (S.active && R.thread) renderThread();
}
function applySearchMarks(rerender) {
  if (!S.search.open) return;
  if (rerender) renderThread();
  const q = S.search.q.toLowerCase();
  const els = [...R.thread.querySelectorAll('.msg')];
  S.search.hits = [];
  els.forEach(el => {
    const hit = q && (el._m.content || '').toLowerCase().includes(q) && !el._m.deleted;
    el.classList.toggle('dim', !!q && !hit);
    if (hit) S.search.hits.push(el);
  });
  S.search.at = S.search.hits.length - 1;
  paintSearch();
  if (S.search.hits.length && rerender) S.search.hits[S.search.at].scrollIntoView({ block: 'center' });
}
function stepSearch(dir) {
  const n = S.search.hits.length; if (!n) return;
  S.search.at = (S.search.at + dir + n) % n;
  paintSearch();
  S.search.hits[S.search.at].scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function paintSearch() {
  S.search.hits.forEach((el, i) => el.classList.toggle('hit', i === S.search.at));
  if (R.searchCount) R.searchCount.textContent = S.search.q ? (S.search.hits.length ? (S.search.at + 1) + ' of ' + S.search.hits.length : 'None') : '';
}

    qBox.replaceChildren(...queue.map((q, i) => h('div', { class: 'q' }, ico(q.type.startsWith('image/') ? 'image' : q.type.startsWith('video/') ? 'video' : 'file'), h('span', null, q.name), h('small', null, fmtSize(q.size)),
      h('button', { type: 'button', class: 'icon-btn', style: 'width:28px;height:28px', 'aria-label': 'Remove ' + q.name, onclick: () => { queue.splice(i, 1); redraw(); } }, ico('x')))));
    qBox.classList.toggle('hidden', queue.length < 2);
    sendBtn.lastChild.textContent = queue.length > 1 ? 'Send ' + queue.length : 'Send';
  };
  sendBtn.onclick = () => { const f = queue.slice(); const cap = caption.value.trim(); closeModal(); sendFiles(f, cap); };
  caption.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); } };
  openModal('Send to ' + chatTitle(c), [previewBox, qBox, caption], sendBtn, true);

// drag and drop
function setupDragDrop() {
  let depth = 0;
  const chat = R.chat;
  chat.addEventListener('dragenter', e => { if (!S.active || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); depth++; R.drop.classList.remove('hidden'); });
  chat.addEventListener('dragover', e => { if (S.active) e.preventDefault(); });
  chat.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) R.drop.classList.add('hidden'); });
  chat.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; R.drop.classList.add('hidden');
    if (!S.active) return;
    const files = [...(e.dataTransfer ? e.dataTransfer.files : [])];
    if (files.length) openSendDialog(files);
  });
}

let rec = null;
async function startRecording() {
  if (!S.active) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('This browser cannot record audio.', true); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast('Microphone access was blocked. Allow it in the address bar and try again.', true); return; }
  const mr = new MediaRecorder(stream);
  const chunks = [];
  const t0 = Date.now();
  const timer = h('span', { class: 't' }, '0:00');
  const tick = setInterval(() => { timer.textContent = fmtDur((Date.now() - t0) / 1000); }, 250);
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stop = send => {
    clearInterval(tick);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      endRecordingUi();
      if (send && chunks.length) {
        const type = mr.mimeType || 'audio/webm';
        const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
        const file = new File(chunks, 'voice-note-' + Date.now() + '.' + ext, { type: type.split(';')[0] });
        sendFiles([file], '');
      }
    };
    if (mr.state !== 'inactive') mr.stop();
  };
  rec = { stop };
  R.field.classList.add('hidden');
  R.recBar = h('div', { class: 'rec' },
    btn('icon-btn', 'Cancel recording', 'trash', () => stop(false)),
    h('span', { class: 'led' }), timer, h('span', { class: 'hint' }, 'Recording'));
  R.composer.insertBefore(R.recBar, R.sendBtn);
  R.sendBtn.replaceChildren(ico('send'));
  R.sendBtn.onclick = () => stop(true);
  mr.start();
}
function endRecordingUi() {
  rec = null;
  R.recBar?.remove(); R.recBar = null;
  R.field.classList.remove('hidden');
  R.sendBtn.onclick = onSendOrMic;
  syncSendButton();
}

// A searchable list of people with check marks and removable chips.
function memberPicker(excludeIds, onChange) {
  const exclude = new Set(excludeIds || []);
  const picked = new Map();     // id -> user
  const known = new Map();
  const input = h('input', { class: 'fld', type: 'search', placeholder: 'Search people by name or email', 'aria-label': 'Search people' });
  const chips = h('div', { class: 'chips' });
  const list = h('div', { class: 'people' });
  let timer = null, seq = 0;

  const drawChips = () => {
    chips.replaceChildren(...[...picked.values()].map(u => h('span', { class: 'chip' }, userName(u),
      h('button', { type: 'button', 'aria-label': 'Remove ' + userName(u), onclick: () => { picked.delete(u.id); drawChips(); drawList(lastRows); onChange(); } }, ico('x')))));
  };
  let lastRows = [];
  const drawList = users => {
    lastRows = users || [];
    const rows = lastRows.filter(u => u && u.id && !exclude.has(u.id) && (!S.me || u.id !== S.me.id));
    list.replaceChildren(...(rows.length ? rows.map(u => {
      const on = picked.has(u.id);
      return h('button', { class: 'person' + (on ? ' sel' : ''), type: 'button', 'aria-pressed': on ? 'true' : 'false',
        onclick: () => { on ? picked.delete(u.id) : picked.set(u.id, u); drawChips(); drawList(lastRows); onChange(); } },
        avatar(userName(u), u.profilePictureUrl, u.id, 'sm'),
        h('div', null, h('div', { class: 'n' }, userName(u)), h('div', { class: 'e' }, u.email || u.username || '')),
        h('span', { class: 'tick-box' }, ico('check')));
    }) : [h('div', { class: 'empty' }, h('p', null, 'No one found.'))]));
  };
  const load = async q => {
    const mine = ++seq;
    try {
      const users = q ? await api('/api/users/search?query=' + encodeURIComponent(q)) : await api('/api/users?page=0&size=50');
      if (mine !== seq) return;
      (users || []).forEach(u => known.set(u.id, u));
      drawList(users);
    } catch (e) { if (mine === seq) list.replaceChildren(h('div', { class: 'empty' }, h('p', null, e.message))); }
  };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(() => load(input.value.trim()), 260); };
  list.replaceChildren(h('div', { class: 'empty' }, h('p', null, 'Loading')));
  load('');
  return { nodes: [input, chips, list], ids: () => [...picked.keys()], count: () => picked.size, focus: () => input.focus() };
}

async function leaveGroup(c) {

  if (!confirm('Leave "' + chatTitle(c) + '"? You will stop receiving its messages.')) return;
  try {

    S.chats = S.chats.filter(x => x.id !== c.id);

    loadChats(true);
  } catch (e) { toast(e.message, true); }

// Pushed by the server when a group changes (added, removed, renamed, roles).
async function onGroupEvent(d) {
  const before = S.chats.length;
  if (d.event === 'REMOVED') {
    const wasActive = S.active && S.active === d.chatId;
    S.chats = S.chats.filter(c => c.id !== d.chatId);
    if (wasActive) closeChat(); else renderList();
    if (info && info.groupId === d.groupId) closeModal();
    toast('You are no longer in that group');
    return;
  }
  await loadChats(true);
  if (d.event === 'ADDED' && S.chats.length > before) {
    const c = S.chats.find(x => x.groupId === d.groupId);
    toast('You were added to ' + (c ? chatTitle(c) : 'a group'));
  }
  if (info && info.groupId === d.groupId) refreshInfo();
}

function markChatReadLocal(id) {
  const c = chatById(id);
  if (c) {
    c.unreadCount = 0; c.markedUnread = false;
    if (c.lastMessage && S.me && c.lastMessage.senderId !== S.me.id) c.lastMessage.readBy = [...new Set([...(c.lastMessage.readBy || []), S.me.id])];
  }
  S.unread[id] = 0;
  const b = S.msgs[id];
  if (b && S.me) b.list.forEach(m => { if (m.id && m.senderId !== S.me.id && !(m.readBy || []).includes(S.me.id)) m.readBy = [...(m.readBy || []), S.me.id]; });
}
// One request that marks the whole chat read. The server tells each sender.
function markChatRead(id) {

  api('/api/chats/' + encodeURIComponent(id) + '/read', { method: 'POST' }).catch(() => { /* retried on the next open */ });

async function markChatUnread(c) {

async function loadProfile() {

  try {
    const [user, stats, liked, following, mutual, reviews, views] = await Promise.all([

      safe(api('/api/social/stats/' + encodeURIComponent(cur.id))),

async function paintTab(pane, cur, me, reviews, views, user, rerun) {
  const tab = cur.tab;
  const loading = () => pane.replaceChildren(h('div', { class: 'empty' }, h('p', null, 'Loading')));
  const people = async (path, emptyText, key) => {
    loading();
    try {
      const rows = (await api(path)) || [];
      if (prof !== cur || cur.tab !== tab) return;
      pane.replaceChildren(...(rows.length ? rows.map(u => personRow(key ? Object.assign({}, u, { id: u[key] || u.id }) : u)) : [h('div', { class: 'empty' }, h('p', null, emptyText))]));
    } catch (e) { pane.replaceChildren(h('div', { class: 'empty' }, h('p', null, e.message))); }
  };
  if (tab === 'followers') return people('/api/social/my-followers', 'Nobody follows you yet.');
  if (tab === 'following') return people('/api/social/my-following', 'You are not following anyone yet.');
  if (tab === 'likedby') return people('/api/social/my-likers', 'Nobody has liked your profile yet.');
  if (tab === 'views') {
    loading();
    try {
      const rows = (await api('/api/profile/views/who-viewed-me')) || [];
      if (prof !== cur || cur.tab !== tab) return;
      const head = h('div', { class: 'p-views' },
        h('div', null, h('b', null, views.totalViews || 0), h('span', null, 'Total')),
        h('div', null, h('b', null, views.last7Days || 0), h('span', null, 'Last 7 days')),
        h('div', null, h('b', null, views.last30Days || 0), h('span', null, 'Last 30 days')),
        h('div', null, h('b', null, views.uniqueViewers || 0), h('span', null, 'People')));
      pane.replaceChildren(head, ...(rows.length ? rows.map(v => personRow({ id: v.viewerId, displayName: v.viewerName, profilePictureUrl: v.viewerProfilePicture }, v.viewedAt ? 'Viewed ' + (toDate(v.viewedAt) ? toDate(v.viewedAt).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '') : ''))
        : [h('div', { class: 'empty' }, h('p', null, 'Nobody has viewed your profile yet.'))]));
    } catch (e) { pane.replaceChildren(h('div', { class: 'empty' }, h('p', null, e.message))); }
    return;
  }

  // reviews
  const mine = me ? null : reviews.find(r => r.userId === S.me.id);
  const nodes = [];
  if (!me) nodes.push(reviewForm(user, mine, rerun));
  if (!reviews.length) nodes.push(h('div', { class: 'empty' }, h('p', null, me ? 'Nobody has reviewed you yet.' : 'No reviews yet. Be the first.')));
  const list = h('div', { class: 'reviews' });
  nodes.push(list);
  pane.replaceChildren(...nodes);
  for (const r of reviews.slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))) {
    const who = await getUser(r.userId);
    if (prof !== cur || cur.tab !== tab) return;

        h('div', null, h('div', { class: 'n' }, r.userId === (S.me && S.me.id) ? 'You' : userName(who)), h('div', { class: 'e' }, when ? when.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : ''))),
      stars(r.rating),
      r.comment ? h('p', null, r.comment) : null));
  }
}

// ====================================================================
// Boot and session
// ====================================================================
async function boot() {
  try {
    let me = null;
    try { me = await api('/api/users/me'); } catch (e) { if (e.status === 401) throw e; }
    const chats = await api('/api/chats');
    S.chats = chats || [];
    if (!me && S.chats[0] && S.chats[0].currentUser) me = S.chats[0].currentUser;
    if (!me) me = userFromToken();
    S.me = me;
    S.msgs = {}; S.active = null; S.unread = {}; S.drafts = {};
    renderShell();
    S.chats.forEach(c => { const id = otherId(c); if (id) { const p = presenceOf(c); S.presence[id] = { online: p.online, lastSeen: p.lastSeen }; } });
    renderList(); renderHeader();
    connectWS();
    startPolling();
  } catch (e) {
    if (e.status === 401 || e.status === 403) { S.token = ''; store.del('sessionStorage', 'pm-token'); renderLogin('Your session ended. Sign in again.'); }
    else renderLogin(e.message);
    throw e;
  }
}
function userFromToken() {
  try {
    const p = JSON.parse(atob(S.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return { id: p.userId || p.uid || p.id || p.sub, email: p.sub, firstName: (p.sub || '').split('@')[0] };
  } catch (e) { return { id: '', email: '' }; }
}
function signOut() {
  disconnectWS(); stopPolling();
  S.token = ''; S.me = null; S.chats = []; S.msgs = {}; S.active = null;
  store.del('sessionStorage', 'pm-token');
  document.title = 'Premisave Messenger';
  renderLogin();
}

// ====================================================================
// Live updates (STOMP over WebSocket)
// ====================================================================
function wsUrl() { return S.cfg.api.replace(/^http/i, 'ws') + '/ws-messenger'; }

function disconnectWS() {
  clearTimeout(S.retryTimer);
  const c = S.ws; S.ws = null; S.wsState = 'down';
  if (c) { c.onclose = null; try { c.disconnect(); } catch (e) { /* already closed */ } }
}
function connectWS(force) {
  if (!window.Stomp) { S.wsState = 'down'; updateConn(); return; }
  if (S.ws && !force) return;
  disconnectWS();
  S.wsState = 'connecting'; updateConn();
  let sock;
  try { sock = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
  const client = Stomp.over(sock);
  client.debug = null;
  client.heartbeat.outgoing = 20000; client.heartbeat.incoming = 20000;
  S.ws = client;
  client.connect({ Authorization: 'Bearer ' + S.token }, () => {
    S.wsState = 'open'; S.retry = 0; updateConn();
    subscribeAll(client);
    if (S.wasDown) { S.wasDown = false; resync(); }
    if (S.active) markChatRead(S.active);
  }, () => {
    if (S.ws !== client) return;
    S.ws = null; S.wsState = 'down'; S.wasDown = true; updateConn();
    scheduleReconnect();
  });
  sock.onclose = () => {
    if (S.ws !== client) return;
    S.ws = null; S.wsState = 'down'; S.wasDown = true; updateConn();
    scheduleReconnect();
  };
}
function scheduleReconnect() {
  if (!S.token) return;
  clearTimeout(S.retryTimer);
  S.retry++;
  const wait = Math.min(15000, 800 * Math.pow(1.7, S.retry - 1)) + Math.random() * 400;
  S.wsState = 'down'; updateConn();
  S.retryTimer = setTimeout(() => connectWS(), wait);
}
function parse(frame) { try { return JSON.parse(frame.body); } catch (e) { return null; } }
function subscribeAll(client) {
  client.subscribe('/user/queue/messages', f => { const m = parse(f); if (m) onIncoming(m); });
  client.subscribe('/user/queue/delivery-status', f => { const d = parse(f); if (d) onDelivery(d); });
  client.subscribe('/user/queue/read-receipts', f => { const d = parse(f); if (d) onReadReceipt(d); });
  client.subscribe('/user/queue/typing', f => { const d = parse(f); if (d) onTyping(d); });
  client.subscribe('/user/queue/errors', f => { const d = parse(f); if (d) toast(d.message || 'Something went wrong', true); });
  client.subscribe('/user/queue/groups', f => { const d = parse(f); if (d) onGroupEvent(d); });
  client.subscribe('/topic/presence', f => { const d = parse(f); if (d) onPresence(d); });
}

async function onIncoming(m) {
  if (!m.chatId) return;
  if (m.attachmentId && !m.mediaUrl && !m.deleted) {
    // the push has no signed link, so take the stored copy
    try {
      const rows = await api('/api/messages/chat/' + encodeURIComponent(m.chatId) + '?page=0&size=10');
      const full = (rows || []).find(x => x.id === m.id);
      if (full) m = full;
    } catch (e) { /* fall through with what we have */ }
  }
  addIncoming(m);
}
function onDelivery(d) {
  if (!d.messageId) return;
  if (d.deliveryState === 'FAILED') { patchMessage(d.messageId, m => { m.status = 'FAILED'; }); return; }
  S.deliveredIds.add(d.messageId);
  patchMessage(d.messageId, m => { m._delivered = true; if (m.status === 'SENT' || m.status === 'SENDING') m.status = 'DELIVERED'; });
}
function onReadReceipt(d) {
  if (!d.messageId) return;
  const by = Array.isArray(d.readBy) ? d.readBy : d.readBy ? [d.readBy] : [];
  S.readReceipts.set(d.messageId, [...new Set([...(S.readReceipts.get(d.messageId) || []), ...by])]);
  patchMessage(d.messageId, m => { m.readBy = [...new Set([...(m.readBy || []), ...by])]; m.status = 'READ'; });
}
function patchMessage(id, fn) {
  for (const cid of Object.keys(S.msgs)) {
    const b = S.msgs[cid];
    const m = b.list.find(x => x.id === id);
    if (!m) continue;
    fn(m);
    if (cid === S.active) refreshMeta(m);
    const c = chatById(cid);
    if (c && c.lastMessage && c.lastMessage.id === id) { c.lastMessage = m; renderList(); }
    return;
  }
}
function onTyping(d) {
  const cid = d.chatId; if (!cid) return;
  clearTimeout(S.typing[cid]);
  S.typing[cid] = setTimeout(() => { delete S.typing[cid]; if (cid === S.active) renderHeader(); renderList(); }, 4000);
  if (cid === S.active) renderHeader();
  renderList();
}
function onPresence(d) {
  if (!d.userId) return;
  S.presence[d.userId] = { online: d.status === 'ONLINE', lastSeen: d.status === 'ONLINE' ? null : new Date().toISOString() };
  renderList();
  const c = chatById(S.active);
  if (c && otherId(c) === d.userId) renderHeader();
}

// ---------- catch up after a gap, and polling while the socket is down ----------
async function resync() {
  await loadChats(true);
  const id = S.active; if (!id) return;
  try {
    const rows = await api('/api/messages/chat/' + encodeURIComponent(id) + '?page=0&size=40');
    mergePage(id, rows || []);
  } catch (e) { /* next poll will retry */ }
}
function mergePage(chatId, rows) {
  const b = bucket(chatId);
  const chronological = rows.slice().reverse();
  for (const row of chronological) {
    const have = b.list.find(x => x.id === row.id);
    if (!have) {
      const mine = S.me && row.senderId === S.me.id;
      // skip rows that are the server copy of a message still being sent
      if (mine && b.list.some(x => x._pending && x.content === row.content && x.chatId === row.chatId)) continue;
      addIncoming(row);
    } else {
      have.status = row.status; have.readBy = row.readBy || have.readBy; have.deleted = row.deleted;
      if (row.mediaUrl) have.mediaUrl = row.mediaUrl;
      if (S.active === chatId) refreshMeta(have);
    }
  }
}
let pollTimer = null;
function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (!S.token || document.hidden) return;
    if (S.wsState === 'open') return;      // the socket is doing the work
    resync();
  }, 6000);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.me) return;
  if (S.active) markChatRead(S.active);
  if (S.wsState !== 'open') resync();
});
window.addEventListener('online', () => { if (S.token && S.wsState !== 'open') { S.retry = 0; connectWS(true); } });

// ====================================================================
// Start
// ====================================================================
initTheme();
if (S.token) boot().catch(() => {}); else renderLogin();
</script></body></html>
