const USES_CHOICES = [['', 'Unlimited'], ['1', '1 person'], ['5', '5 people'], ['10', '10 people'], ['50', '50 people'], ['100', '100 people']];

function openInvite(g) {
  const base = '/api/groups/' + encodeURIComponent(g.id) + '/invite';
  const body = h('div', { class: 'inv' });
  const back = S.chats.find(c => c.groupId === g.id);
  let closed = false;
  const newBtn = h('button', { class: 'btn ghost hidden', type: 'button' }, ico('plus'), 'New link');
  const revokeBtn = h('button', { class: 'btn danger hidden', type: 'button' }, ico('trash'), 'Revoke');
  const m = openModal('Invite to ' + g.name, [body], [h('button', { class: 'btn ghost', type: 'button', onclick: () => back ? openGroupInfo(back) : closeModal() }, 'Back'), h('div', { style: 'flex:1' }), newBtn, revokeBtn]);
  const setLinkButtons = on => { newBtn.classList.toggle('hidden', !on); revokeBtn.classList.toggle('hidden', !on); };
  modalCleanup = () => { closed = true; };
  const note = text => { setLinkButtons(false); body.replaceChildren(h('div', { class: 'empty' }, h('p', null, text))); };

  const when = d => d.toLocaleString([], { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  const options = (title, ctaLabel, onCreate, warn) => {
    const exp = h('select', { class: 'fld', 'aria-label': 'Link expires' }, EXPIRY_CHOICES.map(([v, t]) => h('option', { value: v }, t)));
    const lim = h('select', { class: 'fld', 'aria-label': 'Link limit' }, USES_CHOICES.map(([v, t]) => h('option', { value: v }, t)));
    setLinkButtons(false);
    const go = h('button', { class: 'btn', type: 'button' }, ico('link'), ctaLabel);
    go.onclick = async () => {
      go.disabled = true;
      try { await onCreate(exp.value, lim.value); } catch (e) { go.disabled = false; toast(e.message, true); }
    };
    return h('div', null,
      h('p', { class: 'inv-lead' }, title),
      h('label', { class: 'field-l' }, 'Link expires'), exp,
      h('label', { class: 'field-l' }, 'Who can use it'), lim,
      warn ? h('p', { class: 'note' }, warn) : null,
      h('div', { class: 'row-end' }, go));
  };
  const create = async (exp, lim) => {
    const q = [];
    if (exp) q.push('expiresInHours=' + exp);
    if (lim) q.push('maxUses=' + lim);
    const inv = await api(base + (q.length ? '?' + q.join('&') : ''), { method: 'POST' });
    if (!closed) show(inv);
  };

  const show = inv => {
    const canvas = qrCanvas(inv.link, 216);
    const linkBox = h('input', { class: 'fld', readonly: true, value: inv.link, 'aria-label': 'Invite link', onfocus: e => e.target.select() });
    const exp = toDate(inv.expiresAt);
    const used = inv.maxUses ? inv.uses + ' of ' + inv.maxUses + ' used' : inv.uses ? 'Joined by ' + inv.uses : 'Not used yet';
    const act = (icon, label, fn) => h('button', { class: 'inv-act', type: 'button', onclick: fn }, h('span', { class: 'ic' }, ico(icon)), label);
    const copy = async () => {
      try { await navigator.clipboard.writeText(inv.link); toast('Link copied'); }
      catch (e) { linkBox.focus(); linkBox.select(); toast('Press Ctrl+C to copy the link'); }
    };
    const acts = [act('copy', 'Copy link', copy), act('send', 'Send to chat', () => pickChat(g, inv))];
    if (navigator.share) acts.push(act('share', 'Share', () => navigator.share({ title: g.name, text: 'Join "' + g.name + '" on Premisave Messenger', url: inv.link }).catch(() => {})));
    acts.push(act('download', 'Save QR', () => downloadCanvas(canvas, 'invite-' + g.name.replace(/[^\w-]+/g, '-').toLowerCase() + '.png')));
    newBtn.onclick = () => body.replaceChildren(options('Make a new link', 'Create new link', create, 'The current link and QR code stop working as soon as the new one exists.'));
    revokeBtn.onclick = async () => {
      if (!confirm('Revoke the invite link? The link and its QR code stop working.')) return;
      try { await api(base, { method: 'DELETE' }); toast('Invite link revoked'); if (!closed) body.replaceChildren(options('This group has no working link.', 'Create link', create)); }
      catch (e) { toast(e.message, true); }
    };
    setLinkButtons(true);
    body.replaceChildren(
      h('div', { class: 'qr-box' }, canvas),
      h('p', { class: 'inv-lead center' }, 'Anyone who scans this code or opens the link can join.'),
      linkBox,
      h('div', { class: 'inv-meta' }, (exp ? 'Expires ' + when(exp) : 'Never expires') + ' \u00b7 ' + used),
      h('div', { class: 'inv-acts' }, acts));
  };

  (async () => {
    note('Loading');
    try { const inv = await api(base); if (!closed) show(inv); }
    catch (e) {
      if (closed) return;
      if (e.status === 404) body.replaceChildren(options('Make a link that people can open or scan to join. You choose how long it works and how many people can use it.', 'Create link', create));
      else note(e.message);
    }
  })();
  return m;
}

// Send the invite to one of your chats as a message.
function pickChat(g, inv) {
  const list = h('div', { class: 'people' });
  const text = 'Join "' + g.name + '" on Premisave Messenger: ' + inv.link;
  const search = h('input', { class: 'fld', type: 'search', placeholder: 'Search your chats', 'aria-label': 'Search your chats' });
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    const rows = S.chats.filter(c => c.groupId !== g.id && (!q || chatTitle(c).toLowerCase().includes(q)))
      .sort((a, b) => (toDate(b.lastMessageAt) || 0) - (toDate(a.lastMessageAt) || 0));
    list.replaceChildren(...(rows.length ? rows.map(c => h('button', { class: 'person', type: 'button', onclick: () => {
      const temp = pendingMsg(c.id, { content: text, replyToMessageId: null, replyPreview: null });
      pushPending(temp);
      sendPayload(temp, { chatId: c.id, content: text });
      toast('Invite sent to ' + chatTitle(c));
      openInvite(g);
    } }, avatar(chatTitle(c), chatPhoto(c), otherId(c) || c.id, 'sm'), h('div', null, h('div', { class: 'n' }, chatTitle(c)), h('div', { class: 'e' }, c.chatType === 'GROUP' ? 'Group' : (c.otherUser && c.otherUser.email) || '')))) :
      [h('div', { class: 'empty' }, h('p', null, 'No chats to send it to.'))]));
  };
  search.oninput = draw;
  openModal('Send invite to', [search, list], [h('button', { class: 'btn ghost', type: 'button', onclick: () => openInvite(g) }, 'Back')]);
  draw(); search.focus();
}

// ---------- scanning ----------
function cameraMessage(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera access was blocked. Allow the camera for this page, or choose an image or paste the link below.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No camera was found. Choose an image with the QR code or paste the link below.';
  if (n === 'NotReadableError') return 'The camera is busy in another app. Close it there, or choose an image or paste the link below.';
  return (e && e.message) || 'The camera could not start. Choose an image or paste the link below.';
}
let nativeQr; // undefined until checked, then a BarcodeDetector or null
async function nativeDetector() {
  if (nativeQr !== undefined) return nativeQr;
  nativeQr = null;
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) nativeQr = new BarcodeDetector({ formats: ['qr_code'] });
  } catch (e) { nativeQr = null; }
  return nativeQr;
}
// Reads a QR code from a video frame, bitmap or canvas. Returns the text or null.
async function readQr(source, w, h2) {
  const det = await nativeDetector();
  if (det) {
    try { const r = await det.detect(source); if (r && r[0] && r[0].rawValue) return r[0].rawValue; } catch (e) { /* fall back to jsQR */ }
  }
  const cap = 900, k = Math.min(1, cap / Math.max(w, h2));
  const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h2 * k));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(source, 0, 0, cw, ch);
  const r = jsQR(cx.getImageData(0, 0, cw, ch).data, cw, ch, { inversionAttempts: 'attemptBoth' });
  return r ? r.data : null;
}
async function decodeQrFile(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('That file is not an image.')); im.src = URL.createObjectURL(file); });
  }
  const w = bmp.width || bmp.naturalWidth, h2 = bmp.height || bmp.naturalHeight;
  let text = await readQr(bmp, w, h2);
  if (!text && Math.max(w, h2) > 700) {          // very large photos decode better smaller
    const k = 700 / Math.max(w, h2), cv = document.createElement('canvas');
    cv.width = Math.round(w * k); cv.height = Math.round(h2 * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    text = await readQr(cv, cv.width, cv.height);
  }
  if (bmp.close) bmp.close();
  return text;
}
// Opens the camera on a <video> and calls onText for each QR code it sees. Returns a stop function.
async function startScanner(video, onText, onFail) {
  let stream = null, stopped = false, raf = 0, busy = false, last = 0;
  const stop = () => {
    stopped = true; cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  };
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('This page cannot use the camera here. The camera needs https or localhost. Choose an image or paste the link below.');
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) { onFail(cameraMessage(e)); return () => {}; }
  if (stopped) { stop(); return stop; }
  video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream;
  try { await video.play(); } catch (e) { /* autoplay is allowed for muted video, ignore */ }
  const tick = async ts => {
    if (stopped) return;
    raf = requestAnimationFrame(tick);
    if (busy || ts - last < 140 || video.readyState < 2 || !video.videoWidth) return;
    last = ts; busy = true;
    try {
      const text = await readQr(video, video.videoWidth, video.videoHeight);
      if (text && !stopped) onText(text);
    } catch (e) { /* a bad frame is not an error */ }
    busy = false;
  };
  raf = requestAnimationFrame(tick);
  return stop;
}

function openJoinScanner() {
  const video = h('video', { class: 'scan-video', muted: true, playsinline: true, 'aria-label': 'Camera' });
  const msg = h('div', { class: 'scan-msg' }, 'Starting the camera');
  const view = h('div', { class: 'scan-view' }, video, h('div', { class: 'scan-frame' }), msg);
  const hint = h('p', { class: 'note scan-note' }, 'Point the camera at a group QR code.');
  const file = h('input', { type: 'file', accept: 'image/*', class: 'hidden', onchange: async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    hint.textContent = 'Reading the image';
    try {
      const text = await decodeQrFile(f);
      if (!text) { hint.textContent = 'No QR code found in that image. Try a clearer picture.'; return; }
      found(text);
    } catch (ex) { hint.textContent = ex.message; }
  } });
  const paste = h('input', { class: 'fld', placeholder: 'Paste an invite link or code', 'aria-label': 'Invite link or code', autocomplete: 'off' });
  const go = h('button', { class: 'btn', type: 'button', onclick: () => found(paste.value, true) }, 'Join');
  paste.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); found(paste.value, true); } };
  let stop = null, closed = false, handled = false;
  function found(text, typed) {
    const code = inviteCodeFrom(text);
    if (!code) {
      hint.textContent = typed ? 'That is not a group invite link.' : 'That QR code is not a group invite.';
      return;
    }
    if (handled) return;
    handled = true;
    openJoinPreview(code);     // closes this dialog, which stops the camera
  }
  openModal('Join a group', [
    view, hint,
    h('div', { class: 'scan-or' }, h('span', null, 'or')),
    h('div', { class: 'scan-row' }, h('button', { class: 'btn outline', type: 'button', onclick: () => file.click() }, ico('image'), 'Choose an image'), file),
    h('label', { class: 'field-l' }, 'Paste a link'),
    h('div', { class: 'scan-row' }, paste, go)]);
  modalCleanup = () => { closed = true; if (stop) stop(); };
  startScanner(video, text => found(text), why => { view.classList.add('off'); msg.textContent = why; hint.textContent = 'Choose an image with the QR code, or paste the link.'; }).then(s => {
    stop = s;
    if (closed) s();
    else if (video.srcObject) msg.classList.add('hidden');
  });
}

// ---------- the group behind a link ----------
async function openJoinPreview(code) {
  const body = h('div', { class: 'join' }, h('div', { class: 'empty' }, h('p', null, 'Checking the link')));
  const again = h('button', { class: 'btn ghost', type: 'button', onclick: openJoinScanner }, ico('scan'), 'Scan another');
  const m = openModal('Join group', [body], [again]);
  let g;
  try { g = await api('/api/group-invites/' + encodeURIComponent(code)); }
  catch (e) {
    if (!document.body.contains(m)) return;
    body.replaceChildren(h('div', { class: 'empty' }, ico('alert'), h('h3', null, e.status === 410 ? 'This link no longer works' : e.status === 404 ? 'Link not found' : 'Could not open the link'), h('p', null, e.message)));
    return;
  }
  if (!document.body.contains(m)) return;
  const act = h('button', { class: 'btn', type: 'button' }, g.alreadyMember ? 'Open chat' : 'Join group');
  act.onclick = async () => {
    if (g.alreadyMember) { closeModal(); await loadChats(true); if (g.chatId && chatById(g.chatId)) openChat(g.chatId); return; }
    act.disabled = true; act.textContent = 'Joining';
    try {
      const r = await api('/api/group-invites/' + encodeURIComponent(code) + '/join', { method: 'POST' });
      closeModal();
      await loadChats(true);
      if (r.chatId && chatById(r.chatId)) openChat(r.chatId);
      toast(r.alreadyMember ? 'You are already in ' + r.name : 'You joined ' + r.name);
    } catch (e) { act.disabled = false; act.textContent = 'Join group'; toast(e.message, true); }
  };
  body.replaceChildren(h('div', { class: 'join-hero' },
    avatar(g.name, g.groupPhotoUrl, g.groupId, 'lg'),
    h('div', { class: 'g-name' }, h('span', null, g.name)),
    g.description ? h('div', { class: 'g-desc' }, h('span', null, g.description)) : null,
    h('div', { class: 'g-sub' }, g.memberCount + (g.memberCount === 1 ? ' member' : ' members')),
    g.alreadyMember ? h('div', { class: 'g-sub' }, 'You are already in this group.') : null,
    act));
}

// ====================================================================
// Boot and session
// ====================================================================
async function boot() {
  try {
    let me = null;
    try { me = await api('/api/users/me'); } catch (e) { if (e.status === 401) throw e; }
    const chats = await api('/api/chats');
    S.chats = chats || [];
    if (!me && S.chats[0] && S.chats[0].currentUser) me = S.chats[0].currentUser;
    if (!me) me = userFromToken();
    S.me = me;
    S.msgs = {}; S.active = null; S.unread = {}; S.drafts = {};
    renderShell();
    S.chats.forEach(c => { const id = otherId(c); if (id) { const p = presenceOf(c); S.presence[id] = { online: p.online, lastSeen: p.lastSeen }; } });
    renderList(); renderHeader();
    api('/api/messages/settings').then(s => { if (s && s.editWindowHours != null) S.editWindow = Number(s.editWindowHours); }).catch(() => {});
    S.section = 'chats'; S.status.feed = []; S.status.mine = []; S.status.feedLoaded = false; S.status.past = { items: [], page: 0, more: false, loading: false, loaded: false };
    refreshStatusFeed();
    connectWS();
    startPolling();
    runPendingJoin();
  } catch (e) {
    if (e.status === 401 || e.status === 403) { S.token = ''; store.del('sessionStorage', 'pm-token'); renderLogin('Your session ended. Sign in again.'); }
    else renderLogin(e.message);
    throw e;
  }
}
function userFromToken() {
  try {
    const p = JSON.parse(atob(S.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return { id: p.userId || p.uid || p.id || p.sub, email: p.sub, firstName: (p.sub || '').split('@')[0] };
  } catch (e) { return { id: '', email: '' }; }
}
function signOut() {
  disconnectWS(); stopPolling();
  S.token = ''; S.me = null; S.chats = []; S.msgs = {}; S.active = null;
  store.del('sessionStorage', 'pm-token');
  document.title = 'Premisave Messenger';
  renderLogin();
}

// ====================================================================
// Live updates (STOMP over WebSocket)
// ====================================================================
function wsUrl() { return S.cfg.api.replace(/^http/i, 'ws') + '/ws-messenger'; }

function disconnectWS() {
  clearTimeout(S.retryTimer);
  const c = S.ws; S.ws = null; S.wsState = 'down';
  if (c) { c.onclose = null; try { c.disconnect(); } catch (e) { /* already closed */ } }
}
function connectWS(force) {
  if (!window.Stomp) { S.wsState = 'down'; updateConn(); return; }
  if (S.ws && !force) return;
  disconnectWS();
  S.wsState = 'connecting'; updateConn();
  let sock;
  try { sock = new WebSocket(wsUrl()); } catch (e) { scheduleReconnect(); return; }
  const client = Stomp.over(sock);
  client.debug = null;
  client.heartbeat.outgoing = 20000; client.heartbeat.incoming = 20000;
  S.ws = client;
  client.connect({ Authorization: 'Bearer ' + S.token }, () => {
    S.wsState = 'open'; S.retry = 0; updateConn();
    subscribeAll(client);
    if (S.wasDown) { S.wasDown = false; resync(); }
    if (S.active) markChatRead(S.active);
  }, () => {
    if (S.ws !== client) return;
    S.ws = null; S.wsState = 'down'; S.wasDown = true; updateConn();
    scheduleReconnect();
  });
  sock.onclose = () => {
    if (S.ws !== client) return;
    S.ws = null; S.wsState = 'down'; S.wasDown = true; updateConn();
    scheduleReconnect();
  };
}
function scheduleReconnect() {
  if (!S.token) return;
  clearTimeout(S.retryTimer);
  S.retry++;
  const wait = Math.min(15000, 800 * Math.pow(1.7, S.retry - 1)) + Math.random() * 400;
  S.wsState = 'down'; updateConn();
  S.retryTimer = setTimeout(() => connectWS(), wait);
}
function parse(frame) { try { return JSON.parse(frame.body); } catch (e) { return null; } }
function subscribeAll(client) {
  client.subscribe('/user/queue/messages', f => { const m = parse(f); if (m) onIncoming(m); });
  client.subscribe('/user/queue/delivery-status', f => { const d = parse(f); if (d) onDelivery(d); });
  client.subscribe('/user/queue/read-receipts', f => { const d = parse(f); if (d) onReadReceipt(d); });
  client.subscribe('/user/queue/typing', f => { const d = parse(f); if (d) onTyping(d); });
  client.subscribe('/user/queue/errors', f => { const d = parse(f); if (d) toast(d.message || 'Something went wrong', true); });
  client.subscribe('/user/queue/reactions', f => { const d = parse(f); if (d) onReaction(d); });
  client.subscribe('/user/queue/status', f => { const d = parse(f); if (d) onStatusEvent(d); });
  client.subscribe('/user/queue/groups', f => { const d = parse(f); if (d) onGroupEvent(d); });
  client.subscribe('/topic/presence', f => { const d = parse(f); if (d) onPresence(d); });
}

async function onIncoming(m) {
  if (!m.chatId) return;
  if (m.attachmentId && !m.mediaUrl && !m.deleted) {
    // the push has no signed link, so take the stored copy
    try {
      const rows = await api('/api/messages/chat/' + encodeURIComponent(m.chatId) + '?page=0&size=10');
      const full = (rows || []).find(x => x.id === m.id);
      if (full) m = full;
    } catch (e) { /* fall through with what we have */ }
  }
  addIncoming(m);
}
function onDelivery(d) {
  if (!d.messageId) return;
  if (d.deliveryState === 'FAILED') { patchMessage(d.messageId, m => { m.status = 'FAILED'; }); return; }
  S.deliveredIds.add(d.messageId);
  patchMessage(d.messageId, m => { m._delivered = true; if (m.status === 'SENT' || m.status === 'SENDING') m.status = 'DELIVERED'; });
}
function onReadReceipt(d) {
  if (!d.messageId) return;
  const by = Array.isArray(d.readBy) ? d.readBy : d.readBy ? [d.readBy] : [];
  S.readReceipts.set(d.messageId, [...new Set([...(S.readReceipts.get(d.messageId) || []), ...by])]);
  patchMessage(d.messageId, m => { m.readBy = [...new Set([...(m.readBy || []), ...by])]; m.status = 'READ'; });
}
function patchMessage(id, fn) {
  for (const cid of Object.keys(S.msgs)) {
    const b = S.msgs[cid];
    const m = b.list.find(x => x.id === id);
    if (!m) continue;
    fn(m);
    if (cid === S.active) refreshMeta(m);
    const c = chatById(cid);
    if (c && c.lastMessage && c.lastMessage.id === id) { c.lastMessage = m; renderList(); }
    return;
  }
}
function onTyping(d) {
  const cid = d.chatId; if (!cid) return;
  clearTimeout(S.typing[cid]);
  S.typing[cid] = setTimeout(() => { delete S.typing[cid]; if (cid === S.active) renderHeader(); renderList(); }, 4000);
  if (cid === S.active) renderHeader();
  renderList();
}
function onPresence(d) {
  if (!d.userId) return;
  S.presence[d.userId] = { online: d.status === 'ONLINE', lastSeen: d.status === 'ONLINE' ? null : new Date().toISOString() };
  renderList();
  const c = chatById(S.active);
  if (c && otherId(c) === d.userId) renderHeader();
}

// ---------- catch up after a gap, and polling while the socket is down ----------
async function resync() {
  await loadChats(true);
  const id = S.active; if (!id) return;
  try {
    const rows = await api('/api/messages/chat/' + encodeURIComponent(id) + '?page=0&size=40');
    mergePage(id, rows || []);
  } catch (e) { /* next poll will retry */ }
}
function mergePage(chatId, rows) {
  const b = bucket(chatId);
  const chronological = rows.slice().reverse();
  for (const row of chronological) {
    const have = b.list.find(x => x.id === row.id);
    if (!have) {
      const mine = S.me && row.senderId === S.me.id;
      // skip rows that are the server copy of a message still being sent
      if (mine && b.list.some(x => x._pending && x.content === row.content && x.chatId === row.chatId)) continue;
      addIncoming(row);
    } else {
      have.status = row.status; have.readBy = row.readBy || have.readBy; have.deleted = row.deleted;
      if (row.mediaUrl) have.mediaUrl = row.mediaUrl;
      if (S.active === chatId) refreshMeta(have);
    }
  }
}
let pollTimer = null;
function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (!S.token || document.hidden) return;
    if (S.wsState === 'open') return;      // the socket is doing the work
    resync();
  }, 6000);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.me) return;
  if (S.active) markChatRead(S.active);
  if (S.wsState !== 'open') resync();
});
window.addEventListener('online', () => { if (S.token && S.wsState !== 'open') { S.retry = 0; connectWS(true); } });

// Start

initTheme();
S.pendingJoin = takePendingJoin();
if (S.token) boot().catch(() => {}); else renderLogin();
