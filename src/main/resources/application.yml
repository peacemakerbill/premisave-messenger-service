  level:
    com.premisave.messenger: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.multipart: DEBUG   # Added for upload debugging

# ==================== Other Settings ====================
profile-views:
  max-history-size: 20

rate-limit:
  requests-per-minute: 60