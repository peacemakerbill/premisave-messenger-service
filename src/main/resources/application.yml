spring:
  application:
    name: premisave-messenger-service

  # ==================== File Upload Configuration ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  # ==================== Data ====================
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}



  # ==================== WebSocket ====================
  websocket:
    stomp:
      broker:
        heartbeat: 10000
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-messenger}
    database: ${MONGODB_DATABASE:premisave-messenger}

# ==================== Server ====================
server:
  port: 8081

# ==================== Auth Service Integration ====================
auth:
  service:
    url: http://localhost:8080

# ==================== JWT ====================
jwt:
  secret: eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=

# ==================== Cloudinary ====================
cloudinary:
  cloud-name: thepeacemakersllc
  api-key: "929659223288334"
  api-secret: nAsBdgfXx86u7-Y8X2VnLa-2FbQ

# ==================== Logging ====================
