spring:
  application:
    name: premisave-messenger-service

  # ==================== File Upload Configuration ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  # ==================== Data ====================
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-messenger}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false  # Prevents Redis from claiming MongoDB repositories

  # ==================== WebSocket ====================
  websocket:
    stomp:
      broker:
        heartbeat: 10000

  cloud:
    discovery:
      enabled: false

# ==================== Server ====================
server:
  port: 8081

# ==================== Auth Service Integration ====================
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}

# ==================== JWT ====================
jwt:
  secret: ${JWT_SECRET:eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}

# ==================== Cloudinary ====================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:thepeacemakersllc}
  api-key: ${CLOUDINARY_API_KEY:929659223288334}
  api-secret: ${CLOUDINARY_API_SECRET:nAsBdgfXx86u7-Y8X2VnLa-2FbQ}

# ==================== Logging ====================
logging:
  level:
    "[com.premisave.messenger]": DEBUG
    "[org.springframework.web.socket]": DEBUG
    "[org.springframework.data.mongodb]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.springframework.web.multipart]": DEBUG
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR

# ==================== Other Settings ====================
profile-views:
  max-history-size: 20

rate-limit:
  requests-per-minute: 60