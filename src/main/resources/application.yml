spring:
  application:
    name: premisave-messenger-service

  # ==================== File Upload Configuration ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB      # Maximum size per file
      max-request-size: 50MB   # Maximum size for entire request (important for multipart)
      file-size-threshold: 2KB # Files larger than this are written to disk

  # ==================== MongoDB ====================
  data:
    mongodb:
      uri: mongodb://localhost:27017/premisave-messenger
      database: premisave-messenger

  # ==================== Redis ====================
  redis:
    host: localhost
    port: 6379

  # ==================== WebSocket ====================
  websocket:
    stomp:
      broker:
        heartbeat: 10000

# ==================== Server ====================
server:
  port: 8081

# ==================== Auth Service Integration ====================
auth:
  service:
    url: http://localhost:8080

# ==================== JWT ====================
jwt:
  secret: eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=

# ==================== Cloudinary ====================
