spring:
  application:
    name: premisave-messenger-service
    version: 1.0.0

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-messenger}

  data:
    mongodb:
      auto-index-creation: true
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:50MB}
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE:60MB}

  cache:
    type: redis
    redis:
      time-to-live: 5m
    cache-names:
      - users
      - chat-access
      - group-data
      - chat-details
      - message-reactions

  security:
    user:
      name: ${ACTUATOR_USER:actuator}
      password: ${ACTUATOR_PASSWORD:actuator123}

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 100
        thread-name-prefix: messenger-async-
        allow-core-thread-timeout: true
        wait-for-tasks-to-complete-on-shutdown: true
        await-termination-period: 60s

server:
  port: 8081
  shutdown: graceful
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
    max-http-form-post-size: 52428800
    connection-timeout: 20000ms

jwt:
  secret: ${JWT_SECRET:eW91ci12ZXJ5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
  expiration: 86400000
  refresh-expiration: 604800000

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
  compression:
    request:
      enabled: true
      min-request-size: 2048

logging:
  level:
    root: INFO
    '[com.premisave.messenger]': DEBUG
    '[org.springframework.web]': WARN
    '[org.springframework.security]': WARN
    '[org.springframework.data.mongodb]': INFO
    '[org.springframework.data.redis]': INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/messenger-service.log
    max-size: 10MB
    max-history: 10
    total-size-cap: 100MB

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      livenessState:
        enabled: true
      readinessState:
        enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        '[messenger.message.send.latency]': true
    tags:
      application: premisave-messenger

message:
  delivery:
    retry-attempts: 3
    retry-delay-ms: 1000
  idempotency-timeout-hours: 24
  # How long after sending a person may edit their own message, in hours.
  # 0 turns editing off. Set MESSAGE_EDIT_WINDOW_HOURS in .env to change it.
  edit-window-hours: ${MESSAGE_EDIT_WINDOW_HOURS:1}

rate-limit:
  requests-per-minute: 60
  websocket-messages-per-minute: 100

websocket:
  stomp:
    heartbeat:
      client: 10000
      server: 10000

# File attachments (images, video, audio, documents, any file type).
# LOCAL stores under STORAGE_ROOT. NETWORK uses a share the OS has already
# mounted at STORAGE_NETWORK_MOUNT_PATH; the service never mounts anything.
storage:
  mode: ${STORAGE_MODE:LOCAL}
  root: ${STORAGE_ROOT:./data/messenger-storage}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8081}
  max-file-size: ${STORAGE_MAX_FILE_SIZE:50MB}
  url-ttl: ${STORAGE_URL_TTL:6h}
  unclaimed-ttl: ${STORAGE_UNCLAIMED_TTL:24h}
  signing-secret: ${STORAGE_SIGNING_SECRET:}
  network:
    protocol: ${STORAGE_NETWORK_PROTOCOL:SMB}
    host: ${STORAGE_NETWORK_HOST:}
    share: ${STORAGE_NETWORK_SHARE:}
    mount-path: ${STORAGE_NETWORK_MOUNT_PATH:}
    directory: ${STORAGE_NETWORK_DIRECTORY:premisave-messenger}
    require-mount: ${STORAGE_NETWORK_REQUIRE_MOUNT:true}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    '[com.premisave.messenger]': DEBUG
    '[org.springframework]': DEBUG

server:
  compression:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    '[com.premisave.messenger]': INFO
    '[org.springframework]': WARN

server:
  compression:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  mongodb:
    uri: mongodb://localhost:27017/premisave-messenger-test
  data:
    redis:
      url: redis://localhost:6379/1

logging:
  level:
    '[com.premisave.messenger]': DEBUG