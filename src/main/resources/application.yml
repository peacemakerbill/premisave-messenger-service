spring:
  application:
    name: premisave-messenger-service

  # ==================== MongoDB ====================
  data:
    mongodb:
      uri: mongodb://localhost:27017/premisave-messenger
      database: premisave-messenger   # Explicitly force correct database name

  # ==================== Redis ====================
  redis:
    host: localhost
    port: 6379

